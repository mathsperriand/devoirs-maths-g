/* ══ Gmail OAuth ══════════════════════════════════════════════════ */
const GMAIL_CLIENT_ID = "307432189627-58st09frfpui6cepdoij4mv4qil3s6bj.apps.googleusercontent.com";
const GMAIL_SENDER    = "maths.perriand@gmail.com";
const GMAIL_SCOPE     = "https://www.googleapis.com/auth/gmail.send";
var gmailToken = null;

function getGmailToken() {
  return new Promise(function(resolve, reject) {
    if (gmailToken) { resolve(gmailToken); return; }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      reject(new Error("Google Identity Services non chargé")); return;
    }
    var done = false;
    var timer = setTimeout(function() {
      if (!done) { done = true; reject(new Error("Délai dépassé — réessayez")); }
    }, 120000);
    window.google.accounts.oauth2.initTokenClient({
      client_id: GMAIL_CLIENT_ID,
      scope: GMAIL_SCOPE,
      login_hint: GMAIL_SENDER,
      callback: function(r) {
        clearTimeout(timer);
        if (done) return; done = true;
        if (r.error) { reject(new Error(r.error)); return; }
        gmailToken = r.access_token;
        setTimeout(function() { gmailToken = null; }, (r.expires_in - 60) * 1000);
        resolve(gmailToken);
      },
      error_callback: function(e) {
        clearTimeout(timer);
        if (!done) { done = true; reject(new Error(e.type || "Autorisation refusée")); }
      }
    }).requestAccessToken({ prompt: "select_account" });
  });
}

function b64url(s) {
  return btoa(unescape(encodeURIComponent(s)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function buildHtmlMime(to, subj, htmlBody) {
  var katexCss = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
  var full = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"/>"
    + "<link rel=\"stylesheet\" href=\"" + katexCss + "\"/>"
    + "<style>body{font-family:Georgia,serif;max-width:620px;margin:0 auto;padding:24px;color:#111;line-height:1.7;font-size:13pt}"
    + "h1{font-size:15pt;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:16px}"
    + "table{width:100%;border-collapse:collapse;font-size:11pt;margin-bottom:16px}"
    + "td{padding:5px 8px;border-top:1px solid #e5e7eb;vertical-align:top}"
    + ".note{font-size:24pt;font-weight:bold}"
    + ".appr{color:#555;font-style:italic;margin-bottom:12px}"
    + ".conseil{background:#eff6ff;border-left:3px solid #3b82f6;padding:12px 16px;margin-top:16px;border-radius:4px;color:#1e40af}"
    + ".sig{margin-top:20px;color:#555;font-size:11pt}"
    + "</style></head><body>" + htmlBody + "</body></html>";
  return b64url([
    "From: " + GMAIL_SENDER,
    "To: " + to,
    "Subject: =?UTF-8?B?" + btoa(unescape(encodeURIComponent(subj))) + "?=",
    "MIME-Version: 1.0",
    "Content-Type: text/html; charset=utf-8",
    "Content-Transfer-Encoding: base64",
    "",
    btoa(unescape(encodeURIComponent(full)))
  ].join("\r\n"));
}

async function sendGmailHtml(to, subj, htmlBody) {
  var token = await getGmailToken();
  var raw = buildHtmlMime(to, subj, htmlBody);
  var res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ raw: raw })
  });
  if (!res.ok) {
    var err = await res.json();
    throw new Error(err.error ? err.error.message : "Erreur Gmail");
  }
}

/* ══ Gmail — envoi avec pièce jointe PDF ═══════════════════════════ */
async function sendGmailWithAttachment(to, subj, bodyHtml, pdfBase64, pdfFilename) {
  var token = await getGmailToken();
  var bnd = "bndry_" + Math.random().toString(36).slice(2, 10);
  // HTML body encodé en base64 (gère les caractères UTF-8)
  var bodyB64 = btoa(unescape(encodeURIComponent(bodyHtml)));
  // PDF base64 découpé en lignes de 76 chars (RFC 2045)
  var pdfLines = (pdfBase64.match(/.{1,76}/g) || []).join("\r\n");
  // Construire le MIME multipart (tout en ASCII après encodage)
  var mime = [
    "From: " + GMAIL_SENDER,
    "To: " + to,
    "Subject: =?UTF-8?B?" + btoa(unescape(encodeURIComponent(subj))) + "?=",
    "MIME-Version: 1.0",
    "Content-Type: multipart/mixed; boundary=\"" + bnd + "\"",
    "",
    "--" + bnd,
    "Content-Type: text/html; charset=utf-8",
    "Content-Transfer-Encoding: base64",
    "",
    bodyB64,
    "--" + bnd,
    "Content-Type: application/pdf; name=\"" + pdfFilename + "\"",
    "Content-Transfer-Encoding: base64",
    "Content-Disposition: attachment; filename=\"" + pdfFilename + "\"",
    "",
    pdfLines,
    "--" + bnd + "--"
  ].join("\r\n");
  // base64url du message MIME complet (entièrement ASCII à ce stade)
  var raw = btoa(mime).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  var res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ raw: raw })
  });
  if (!res.ok) {
    var err = await res.json();
    throw new Error(err.error ? err.error.message : "Erreur Gmail");
  }
}

/* ══ jsPDF → base64 (chunked, sans stack overflow) ════════════════ */
function pdfToBase64(pdf) {
  var ab = pdf.output("arraybuffer");
  var bytes = new Uint8Array(ab);
  var bin = "", chunk = 8192;
  for (var i = 0; i < bytes.length; i += chunk)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
}

/* ══ LaTeX → HTML (KaTeX) ═════════════════════════════════════════ */
/* ══ Réparation JSON LaTeX ════════════════════════════════════════
   Claude écrit parfois du LaTeX brut dans les valeurs JSON :
     "remarque":"soit $\frac{a}{b}$"  ← \f, \s, \a… invalides en JSON
   Cette fonction double tous les backslashes sauf \" \\ \n \uXXXX.
   \n est préservé pour les sauts de ligne intentionnels.           */
function fixJsonBackslashes(raw) {
  var out = [], inStr = false, i = 0;
  while (i < raw.length) {
    var c = raw[i];
    if (!inStr) {
      out.push(c);
      if (c === '"') inStr = true;
      i++;
    } else if (c === '\\') {
      var n = raw[i + 1] || '';
      if (n === '"' || n === '\\') {
        out.push(c, n); i += 2;                                  // \" et \\ — garder
      } else if (n === 'n') {
        out.push(c, n); i += 2;                                  // \n newline — garder
      } else if (n === 'u' && /[0-9a-fA-F]{4}/.test(raw.slice(i+2, i+6))) {
        out.push(c, n, raw[i+2], raw[i+3], raw[i+4], raw[i+5]); i += 6; // \uXXXX — garder
      } else {
        out.push('\\', '\\'); i++;  // tout le reste (\frac \sum \theta …) — doubler
      }
    } else {
      if (c === '"') inStr = false;
      out.push(c); i++;
    }
  }
  return out.join('');
}
function safeJsonParse(raw) {
  var s = raw.replace(/```json|```/g, '').trim();
  try { return JSON.parse(s); } catch(e) {
    try { return JSON.parse(fixJsonBackslashes(s)); } catch(e2) {
      throw new Error('JSON invalide : ' + e.message);
    }
  }
}

function latexToHtml(src) {
  if (!window.katex || !src) return "<pre style=\"white-space:pre-wrap\">" + (src || "") + "</pre>";
  function rk(m, disp) {
    try {
      return window.katex.renderToString(m.trim(), {
        displayMode: disp, throwOnError: true, output: "html"
      });
    } catch(e) {
      var clean = m.replace(/\\[a-zA-Z]+\{[^}]*\}/g," ")
                   .replace(/\\[a-zA-Z]+/g," ")
                   .replace(/[{}$&\\]/g," ")
                   .replace(/\s+/g," ").trim();
      return disp
        ? '<div style=\"margin:8px 0;text-align:center;color:#555;font-style:italic\">'+clean+'</div>'
        : '<span style=\"color:#555\">'+clean+'</span>';
    }
  }
  // Regex définies en variables — évite toute confusion d'échappement
  var RE1 = /\\\[([\s\S]+?)\\\]/g;   // \[...\] display
  var RE2 = /\\\(([\s\S]+?)\\\)/g;   // \(...\) inline
  var RE3 = /\$\$([\s\S]+?)\$\$/g;   // $$...$$ display
  var RE4 = /\$([^$\r\n]+?)\$/g;     // $...$ inline

  var h = src
    .replace(RE1, function(_, m) { return "<div style=\"margin:10px 0;text-align:center\">" + rk(m, true) + "</div>"; })
    .replace(RE2, function(_, m) { return rk(m, false); })
    .replace(RE3, function(_, m) { return "<div style=\"margin:10px 0;text-align:center\">" + rk(m, true) + "</div>"; })
    .replace(RE4, function(_, m) { return rk(m, false); });

  h = h
    .replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, "<div style=\"text-align:center\">$1</div>")
    .replace(/\\textbf\{([^}]+)\}/g, "<strong>$1</strong>")
    .replace(/\\textit\{([^}]+)\}/g, "<em>$1</em>")
    .replace(/\{\\Large\\textbf\{([^}]+)\}\}/g, "<h1 style=\"font-size:16pt;text-align:center;margin:12px 0\">$1</h1>")
    .replace(/\\section\*?\{([^}]+)\}/g, "<h2 style=\"font-size:13pt;margin:16px 0 8px;font-weight:bold\">$1</h2>")
    .replace(/\\subsection\*?\{([^}]+)\}/g, "<h3 style=\"font-size:12pt;margin:12px 0 6px;font-weight:bold\">$1</h3>")
    .replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g, function(_, b) {
      return "<ol style=\"padding-left:24px;margin:8px 0\">" + b.replace(/\\item\s+/g, "<li>").replace(/<li>([^<]*)/g, "<li>$1</li>") + "</ol>";
    })
    .replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g, function(_, b) {
      return "<ul style=\"padding-left:24px;margin:8px 0\">" + b.replace(/\\item\s+/g, "<li>").replace(/<li>([^<]*)/g, "<li>$1</li>") + "</ul>";
    })
    .replace(/\\hfill/g, "<span style=\"float:right\">")
    .replace(/\\\\(\[[\d.]+pt\])?/g, "<br/>")
    .replace(/\\vspace\{[^}]+\}/g, "<div style=\"height:8px\"></div>")
    .replace(/\\newline/g, "<br/>")
    .replace(/\\hline/g, "")
    .replace(/\\[a-zA-Z]+\{([^}]*)\}/g, "$1")
    .replace(/\\[a-zA-Z]+/g, "")
    .replace(/\n{2,}/g, "<br/><br/>")  // double saut = séparation visuelle
    .replace(/\n/g, "<br/>");           // saut simple = retour à la ligne
  return "<div style=\"margin:0\">" + h + "</div>";
}

/* ══ Micro-composants ═════════════════════════════════════════════ */
function Card({ children, style }) {
  return React.createElement("div", {
    style: Object.assign({ background:"#fff", border:"0.5px solid #e5e7eb", borderRadius:10, padding:"1.25rem", marginBottom:"1rem" }, style || {})
  }, children);
}
function Field({ label, children }) {
  return React.createElement("div", { style:{ marginBottom:4 } },
    React.createElement("span", { style:{ display:"block", fontSize:13, color:"#6b7280", marginBottom:6 } }, label),
    children
  );
}
function DropZone({ id, multiple, loaded, name, onFiles, label, sub }) {
  var handle = function(files) { if (files && files.length) onFiles(files); };
  return (
    <div
      onDragOver={function(e){e.preventDefault();}}
      onDrop={function(e){e.preventDefault();handle(e.dataTransfer.files);}}
      onClick={function(){document.getElementById(id).click();}}
      style={{border:"1.5px dashed #d1d5db",borderRadius:8,padding:"1.2rem",textAlign:"center",cursor:"pointer",background:loaded?"#f0fdf4":"#f9fafb",marginBottom:8}}
    >
      <input id={id} type="file" accept="application/pdf" multiple={multiple} style={{display:"none"}} onChange={function(e){handle(e.target.files);}}/>
      {loaded
        ? <span style={{color:"#16a34a",fontWeight:500}}>✓ {name}</span>
        : <span style={{color:"#6b7280",fontSize:13}}>{label}<br/><span style={{fontSize:11}}>{sub}</span></span>
      }
    </div>
  );
}
function Bdg({ color, children }) {
  var m = { success:["#dcfce7","#16a34a"], danger:["#fee2e2","#dc2626"], info:["#dbeafe","#1d4ed8"] };
  var pair = m[color] || m.info;
  return <span style={{fontSize:11,fontWeight:500,padding:"3px 10px",borderRadius:6,background:pair[0],color:pair[1]}}>{children}</span>;
}

/* ══ SessionManager ═══════════════════════════════════════════════ */
function SessionManager({ onSelect }) {
  var [sessions, setSessions] = useState(function() { return getSessions(); });
  var [name, setName] = useState("");
  function refresh() { setSessions(getSessions()); }
  function create() {
    var n = name.trim() || "Devoir du " + new Date().toLocaleDateString("fr-FR");
    var id = newId();
    saveSession(id, { name: n, createdAt: Date.now() });
    setName(""); refresh(); onSelect(id, n);
  }
  var entries = Object.entries(sessions).sort(function(a,b){ return (b[1].createdAt||0)-(a[1].createdAt||0); });
  var lastId = getActive();
  var last   = lastId && sessions[lastId] ? sessions[lastId] : null;
  return (
    <div style={{maxWidth:700,margin:"0 auto",padding:"2rem 1rem"}}>
      <h1 style={{marginBottom:8,fontSize:20}}>📐 Gestionnaire de devoirs</h1>
      <p style={{fontSize:13,color:"#6b7280",marginBottom:"1.5rem"}}>Chaque devoir est indépendant — ouvrez-en plusieurs dans des onglets différents.</p>
      {last && (
        <div style={{background:"#dbeafe",border:"0.5px solid #93c5fd",borderRadius:10,padding:"14px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:12,color:"#1d4ed8",marginBottom:2}}>Dernier devoir ouvert</div>
            <div style={{fontWeight:500}}>{last.name}</div>
          </div>
          <button onClick={function(){onSelect(lastId,last.name);}} style={{background:"#1d4ed8",border:"none",flexShrink:0}}>Reprendre →</button>
        </div>
      )}
      <Card>
        <div style={{fontSize:14,fontWeight:500,marginBottom:10}}>➕ Nouveau devoir</div>
        <div style={{display:"flex",gap:8}}>
          <input type="text" value={name} onChange={function(e){setName(e.target.value);}} placeholder="Ex : Terminale – Suites – Jan 2025" onKeyDown={function(e){if(e.key==="Enter")create();}} style={{flex:1}}/>
          <button onClick={create} style={{flexShrink:0}}>Créer</button>
        </div>
      </Card>
      {entries.length > 0 && (
        <Card>
          <div style={{fontSize:14,fontWeight:500,marginBottom:10}}>📂 Devoirs existants</div>
          {entries.map(function([id,s]) {
            return (
              <div key={id} onClick={function(){onSelect(id,s.name);}}
                style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",marginBottom:6,borderRadius:8,cursor:"pointer",background:"#f3f4f6",border:"0.5px solid #e5e7eb"}}
                onMouseEnter={function(e){e.currentTarget.style.background="#e5e7eb";}}
                onMouseLeave={function(e){e.currentTarget.style.background="#f3f4f6";}}>
                <div>
                  <div style={{fontWeight:500,fontSize:14}}>{s.name}</div>
                  <div style={{fontSize:11,color:"#9ca3af"}}>
                    {s.createdAt ? new Date(s.createdAt).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}) : ""}
                    {s.step > 0 ? " — Étape " + (s.step+1) + "/4" : ""}
                    {s.corrections && s.corrections.filter(function(c){return !c.skipped;}).length > 0 ? " — " + s.corrections.filter(function(c){return !c.skipped;}).length + " corrigée(s)" : ""}
                  </div>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:12,color:"#1d4ed8",fontWeight:500}}>Ouvrir →</span>
                  <span onClick={function(e){e.stopPropagation();if(window.confirm("Supprimer ce devoir ?"))delSession(id),refresh();}} style={{fontSize:12,color:"#dc2626",cursor:"pointer",padding:"2px 6px"}}>✕</span>
                </div>
              </div>
            );
          })}
        </Card>
      )}
      {entries.length === 0 && <p style={{textAlign:"center",color:"#9ca3af",fontSize:13,marginTop:"2rem"}}>Aucun devoir — créez-en un ci-dessus.</p>}
    </div>
  );
}

/* ══ App Router ═══════════════════════════════════════════════════ */
function App() {
  var [sid,   setSid]   = useState(null);
  var [sname, setSname] = useState("");
  function open(id, name) { setActive(id); setSid(id); setSname(name); }
  if (!sid) return <SessionManager onSelect={open}/>;
  return <Devoir sid={sid} sname={sname} onBack={function(){ setSid(null); setSname(""); }}/>;
}

/* ══ Devoir ═══════════════════════════════════════════════════════ */
function Devoir({ sid, sname, onBack }) {

  // Persist helpers
  function ld(k, fb) { var s = getSession(sid); return s[k] !== undefined ? s[k] : fb; }
  function ps(k, v)  { var all = getSessions(); var s = all[sid] || {}; s[k] = v; saveSession(sid, s); }

  // Clé API (partagée entre sessions)
  var [apiKey, setApiKeyR] = useState(function() { try { return localStorage.getItem("pf_apikey") || ""; } catch(e) { return ""; } });
  function setApiKey(v) { setApiKeyR(v); try { localStorage.setItem("pf_apikey", v); } catch(e) {} }

  /* ── Lire un fichier → base64 ── */
  function readFile(file) {
    return new Promise(function(res) {
      var r = new FileReader();
      r.onload = function(e) { res(e.target.result.split(",")[1]); };
      r.readAsDataURL(file);
    });
  }

    for (var i = 0; i < arr.length; i++) {

  /* ── Charger html2canvas à la demande ── */
  function loadH2C() {
    return new Promise(function(res, rej) {
      if (window.html2canvas) { res(); return; }
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  /* ── Télécharger sujet en PDF ── */
  async function downloadSubjectPdf() {
    if (!previewRef.current || !window.jspdf) return;
    setBusy(true); setStatus("Génération du PDF…");
    try {
      await loadH2C();
      var el = previewRef.current;
      var canvas = await window.html2canvas(el, { scale:2, useCORS:true, backgroundColor:"#ffffff", logging:false });
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
      var W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), m = 15;
      var iw = W - m*2, remaining = (canvas.height * iw) / canvas.width, srcY = 0;
      while (remaining > 0) {
        var sliceH = Math.min(remaining, H - m*2);
        var sc = document.createElement("canvas");
        var ratio = canvas.width / iw;
        sc.width = canvas.width; sc.height = sliceH * ratio;
        sc.getContext("2d").drawImage(canvas, 0, srcY*ratio, canvas.width, sliceH*ratio, 0, 0, canvas.width, sliceH*ratio);
        if (srcY > 0) pdf.addPage();
        pdf.addImage(sc.toDataURL("image/png"), "PNG", m, m, iw, sliceH);
        srcY += sliceH; remaining -= sliceH;
      }
      pdf.save("sujet_maths.pdf");
    } catch(e) { setStatus("❌ PDF : " + e.message); }
    finally { setBusy(false); }
  }

      var s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
      s.onload=function(){res(window.PDFLib);}; s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  /* ── Phase 1 : repérage pages (1 requête légère) ── */
  async function detectPageRanges(pdfB64, names) {
    var raw = await callClaude(apiKey,[{role:"user",content:[
      {type:"document",source:{type:"base64",media_type:"application/pdf",data:pdfB64}},
      {type:"text",text:"Élèves :\n"+names.join("\n")+
        "\n\nDis-moi à quelle page commence et finit chaque copie."+
        "\nJSON uniquement :\n[{\"name\":\"Prenom Nom\",\"pageStart\":1,\"pageEnd\":2}]"}
    ]}],"Analyse PDF. JSON uniquement, compact.");
    return safeJsonParse(raw);
  }

  /* ── Phase 2 : découpage local (aucune requête) ── */
  async function extractStudentPdf(PDFLib,fullB64,pageStart,pageEnd){
    var src=new Uint8Array(atob(fullB64).split("").map(function(c){return c.charCodeAt(0);}));
    var srcDoc=await PDFLib.PDFDocument.load(src);
    var newDoc=await PDFLib.PDFDocument.create();
    var idx=[];for(var i=pageStart-1;i<pageEnd;i++)idx.push(i);
    var pages=await newDoc.copyPages(srcDoc,idx);
    pages.forEach(function(p){newDoc.addPage(p);});
    var bytes=await newDoc.save();
    var bin="",chunk=8192;
    for(var j=0;j<bytes.length;j+=chunk)
      bin+=String.fromCharCode.apply(null,bytes.subarray(j,j+chunk));
    return btoa(bin);
  }

  /* ── Phase 3 : correction individuelle (PDF 2 pages) ── */
  async function correctOnePdf(studentB64,name,corrRefText){
    var blocks=[];
    // Si on a le corrigé en texte, on l'envoie à la place du PDF sujet (économie tokens majeure)
    if(corrRefText){
      blocks.push({type:"text",text:"CORRIGÉ DE RÉFÉRENCE (barème) :\n"+corrRefText});
    } else if(upSubPdf){
      blocks.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:upSubPdf}});
    }
    blocks.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:studentB64}});
    blocks.push({type:"text",text:"Élève : "+name+". Corrige UNIQUEMENT cette copie. 1 objet JSON."});
    var raw=await callClaude(apiKey,[{role:"user",content:blocks}],corrPrompt);
    var p=safeJsonParse(raw);
    return Array.isArray(p)?p[0]:p;
  }

  /* ── Fallback : correction par lots ── */
  async function correctByLots(copyList,corrRefText){
    var results=[],LOT_SIZE=10,totalLots=Math.ceil(copyList.length/LOT_SIZE);
    for(var lot=0;lot<totalLots;lot++){
      var lotS=lot*LOT_SIZE,lotE=Math.min(lotS+LOT_SIZE,copyList.length);
      if(totalLots>1) setStatus("Lot "+(lot+1)+"/"+totalLots+" — copies "+(lotS+1)+" à "+lotE+"…");
      for(var i=lotS;i<lotE;i++){
        setStatus("Correction "+(i+1)+"/"+copyList.length+"…");
        var blocks=[];
        if(corrRefText){
          blocks.push({type:"text",text:"CORRIGÉ DE RÉFÉRENCE :\n"+corrRefText});
        } else if(upSubPdf){
          blocks.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:upSubPdf}});
        }
        blocks.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:copyList[i].b64}});
        blocks.push({type:"text",text:
          "Copies attendues :\n"+parsedStudents.map(function(s){return "- "+s.name;}).join("\n")+
          "\nIdentifie la copie et ses pages. JSON uniquement."
        });
        var raw=await callClaude(apiKey,[{role:"user",content:blocks}],corrPrompt);
        results=results.concat(safeJsonParse(raw));
      }
    }
    return results;
  }

  /* ── Correction depuis PDF ── */
  async function correctFromPdf() {
    if(!copies.length||!apiKey)return;
    setBusy(true);
    try {
      // Étape 0 : générer le corrigé de référence EN PREMIER (évite d'envoyer le PDF sujet à chaque copie)
      var activeCorrRef = corrRef;
      if(!activeCorrRef && upSubPdf){
        setStatus("Génération du corrigé de référence (1 seul appel)…");
        try{
          var sysR = await callClaude(apiKey,
            [{role:"user",content:[
              {type:"document",source:{type:"base64",media_type:"application/pdf",data:upSubPdf}},
              {type:"text",text:"Génère le corrigé complet et détaillé en LaTeX. Exercice par exercice, toutes les étapes, toutes les formules."}
            ]}],
            DEFAULT_CORR_SYS
          );
          activeCorrRef = sysR.trim();
          setCorrRef(activeCorrRef);
        }catch(e){ console.warn("Corrigé ref échoué, on continue sans:",e); }
      }

      var allResults=[];
      if(copies.length===1){
        setStatus("Repérage des copies dans le PDF…");
        var pageRanges=null;
        try{ pageRanges=await detectPageRanges(copies[0].b64,parsedStudents.map(function(s){return s.name;})); }
        catch(e){ console.warn("Repérage échoué:",e); }
        if(pageRanges&&pageRanges.length>0){
          var PDFLib=null;
          try{ PDFLib=await loadPdfLib(); }catch(e){ console.warn("pdf-lib indispo:",e); }
          if(PDFLib){
            for(var i=0;i<pageRanges.length;i++){
              var pr=pageRanges[i];
              setProgress({current:i+1,total:pageRanges.length,label:pr.name.split(" ")[0]});
              try{
                var sp=await extractStudentPdf(PDFLib,copies[0].b64,pr.pageStart,pr.pageEnd);
                var r=await correctOnePdf(sp,pr.name,activeCorrRef);
                if(r)allResults.push(r);
              }catch(e){ console.warn("Erreur "+pr.name,e); }
            }
            setProgress(null);
          } else { allResults=await correctByLots(copies,activeCorrRef); }
        } else { allResults=await correctByLots(copies,activeCorrRef); }
      } else { allResults=await correctByLots(copies,activeCorrRef); }
      setCorrections(parsedStudents.map(function(s){
        var found=allResults.find(function(r){return r.name&&r.name.toLowerCase().includes(s.name.split(" ")[0].toLowerCase());});
        return found?Object.assign({},s,found):Object.assign({},s,{skipped:true});
      }));
    }catch(e){setStatus("❌ "+e.message);console.error("correctFromPdf:",e);}
    finally{setBusy(false);setProgress(null);}
  }

  /* ── Correction manuelle ── */

        setStatus("Correction de " + s.name + "…");

          }], corrPrompt);

      }
      setCorrections(results);
    } finally { setBusy(false); }
    // Générer le corrigé LaTeX si absent
    await buildCorrRef();
  }

  /* ── Copie en retard ── */
  async function addLate(file) {
    if (!file || !apiKey) return;
    setBusy(true); setStatus("Correction en cours…");
    try {
      var b64 = await readFile(file);
      var blocks = [];
      // Utilise le corrigé texte si disponible (économie tokens), sinon le PDF sujet
      if (corrRef) {
        blocks.push({ type:"text", text:"CORRIGÉ DE RÉFÉRENCE :\n" + corrRef });
      } else if (upSubPdf) {
        blocks.push({ type:"document", source:{ type:"base64", media_type:"application/pdf", data:upSubPdf } });
      }
      blocks.push({ type:"document", source:{ type:"base64", media_type:"application/pdf", data:b64 } });
      blocks.push({ type:"text", text:"Copie en retard. JSON uniquement." });
      var raw = await callClaude(apiKey, [{ role:"user", content:blocks }], corrPrompt);
      var arr = safeJsonParse(raw);
      if (arr.length > 0) {
        var r = arr[0];
        var existing = parsedStudents.find(function(s) {
          return r.name && s.name.toLowerCase().includes(r.name.split(" ")[0].toLowerCase());
        });
        setCorrections(function(prev) {
          return prev.concat([Object.assign({}, existing || { id: Date.now(), name: r.name, email: "" }, r)]);
        });
      }
    } catch(e) { setStatus("❌ " + e.message); }
    finally { setBusy(false); }
  }

  /* ── Génération PDF élève (html2canvas → jsPDF) ── */
  async function buildStudentPdf(cor, corrRefLatex, cache) {
    if (!window.jspdf) throw new Error("jsPDF non chargé");
    // html2canvas chargé au préalable par l'appelant

    var nc = !isNaN(+cor.note) ? (+cor.note >= 10 ? "#16a34a" : "#dc2626") : "#111";

    /* ---- Section personnelle ---- */
    var detRows = (cor.details || []).map(function(d) {
      return "<tr>"
        + "<td style=\"padding:6px 8px;border-top:1px solid #e5e7eb;color:#555;vertical-align:top;font-size:10.5pt\">" + d.exercice + "</td>"

        + "<td style=\"padding:6px 8px;border-top:1px solid #e5e7eb;color:#333;vertical-align:top;font-size:10pt\">" + latexToHtml(d.remarque || "") + "</td>"
        + "</tr>";
    }).join("");

    var personalHtml = "<div style=\"font-family:Georgia,serif;color:#111;line-height:1.7;font-size:12pt\">"
      + "<h1 style=\"font-size:15pt;border-bottom:2px solid #333;padding-bottom:8px;margin:0 0 14px\">" + sname + " — Résultats</h1>"
      + "<h2 style=\"font-size:13pt;margin:0 0 6px;font-weight:bold\">" + cor.name + "</h2>"
      + "<p style=\"font-size:30pt;font-weight:bold;color:" + nc + ";margin:8px 0 4px\">" + cor.note + "<span style=\"font-size:14pt;color:#666\"> /20</span></p>"
      + "<p style=\"color:#555;font-style:italic;margin:0 0 12px\">" + (cor.appreciation || "") + "</p>"
      + (detRows ? "<table style=\"width:100%;border-collapse:collapse;margin-bottom:12px\">" + detRows + "</table>" : "")
      + "<div style=\"background:#eff6ff;border-left:3px solid #3b82f6;padding:9px 13px;border-radius:3px;color:#1e40af;font-size:10pt\">"
      + "<strong>Conseil :</strong> " + (cor.conseil || "") + "</div>"
      + "</div>";

    async function renderDiv(html, extraCss) {
      var div = document.createElement("div");
      div.style.cssText = "position:fixed;left:-9999px;top:0;width:680px;background:#fff;" + (extraCss || "padding:28px 36px;");
      div.innerHTML = html;
      document.body.appendChild(div);
      await document.fonts.ready;
      await new Promise(function(r) { setTimeout(r, 700); });
      var cv = await window.html2canvas(div, { scale: 1.5, useCORS: true, backgroundColor: "#ffffff", logging: false });
      document.body.removeChild(div);
      return cv;
    }

    var canvas1 = await renderDiv(personalHtml);

    /* ---- Section corrigé (mise en cache pour le lot) ---- */
    var canvas2 = null;
    if (corrRefLatex) {
      if (cache && cache.corrCanvas) {
        canvas2 = cache.corrCanvas;
      } else {
        var corrHtml = "<div style=\"font-family:Georgia,serif;font-size:11.5pt;line-height:1.75;color:#111\">"
          + "<hr style=\"border:none;border-top:2px solid #333;margin:0 0 14px\"/>"
          + "<h2 style=\"font-size:14pt;margin:0 0 14px;font-weight:bold\">Corrigé du sujet</h2>"
          + latexToHtml(corrRefLatex)
          + "</div>";
        // Attente plus longue pour le corrRef (potentiellement long)
        var div2 = document.createElement("div");
        div2.style.cssText = "position:fixed;left:-9999px;top:0;width:680px;background:#fff;padding:18px 36px 32px;";
        div2.innerHTML = corrHtml;
        document.body.appendChild(div2);
        await document.fonts.ready;
        await new Promise(function(r) { setTimeout(r, 1200); });
        canvas2 = await window.html2canvas(div2, { scale: 1.5, useCORS: true, backgroundColor: "#ffffff", logging: false });
        document.body.removeChild(div2);
        if (cache) cache.corrCanvas = canvas2; // réutilisé pour tous les élèves
      }
    }

    /* ---- Assemblage jsPDF ---- */
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    var W = pdf.internal.pageSize.getWidth();   // 210 mm
    var H = pdf.internal.pageSize.getHeight();  // 297 mm
    var mg = 12, iw = W - mg * 2, ih = H - mg * 2;
    var firstPage = true;

    function addCanvasToPdf(cv) {
      var totalMm = (cv.height / cv.width) * iw;
      var pages = Math.ceil(totalMm / ih);
      for (var p = 0; p < pages; p++) {
        if (!firstPage) pdf.addPage();
        firstPage = false;
        var y0 = Math.round((p * ih / totalMm) * cv.height);
        var y1 = Math.min(Math.round(((p + 1) * ih / totalMm) * cv.height), cv.height);
        var sc = document.createElement("canvas");
        sc.width = cv.width; sc.height = y1 - y0;
        sc.getContext("2d").drawImage(cv, 0, y0, cv.width, sc.height, 0, 0, cv.width, sc.height);
        var sliceMm = (sc.height / cv.height) * totalMm;
        pdf.addImage(sc.toDataURL("image/jpeg", 0.80), "JPEG", mg, mg, iw, sliceMm);
      }
    }

    addCanvasToPdf(canvas1);
    if (canvas2) addCanvasToPdf(canvas2);

    return pdfToBase64(pdf);
  }

  /* ── Envoyer à un élève (PDF en pièce jointe) ── */
  async function sendOne(cor, corrCache) {
    var fname = "Corrige_"
      + cor.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "_")
      + ".pdf";
    setStatus("⏳ PDF " + cor.name.split(" ")[0] + "…");
    var pdfB64 = await buildStudentPdf(cor, corrRef, corrCache || {});
    setStatus("📧 Envoi à " + cor.name.split(" ")[0] + "…");
    await sendGmailWithAttachment(cor.email, "Résultats – " + sname, buildSimpleBodyHtml(cor), pdfB64, fname);
  }

  /* ── Renvoi individuel ── */
  async function resendOne(cor) {
    if (!cor.email || busy) return;
    setResending(cor.id);
    try {
      await getGmailToken();
      await loadH2C();
      await sendOne(cor, {}); // cache vide pour un renvoi isolé
    } catch(e) { alert("Erreur renvoi : " + e.message); }
    finally { setResending(null); setStatus(""); }
  }

  /* ── Envoyer tous les résultats ── */
  async function sendResults() {
    var toSend = corrections.filter(function(c) { return !c.skipped && c.email; });
    if (!toSend.length) return;
    setBusy(true);
    try {
      setStatus("Connexion Gmail…");
      await getGmailToken();
      setStatus("Chargement rendu PDF…");
      await loadH2C();

      // Cache partagé : le corrigé est rendu une seule fois pour tout le lot
      var corrCache = {};

      var errors = [];
      for (var i = 0; i < toSend.length; i++) {
        setProgress({ current: i+1, total: toSend.length, label: toSend[i].name.split(" ")[0] });
        try { await sendOne(toSend[i], corrCache); }
        catch(e) { errors.push(toSend[i].name); console.error(e); }
      }
      setProgress(null);
      setMailsDone(true);
      setStatus(errors.length ? "⚠️ Échec : " + errors.join(", ") : "");
    } catch(e) {
      setStatus("❌ " + (e.message || String(e)));
    } finally {
      setBusy(false);
    }
  }

  /* ── Export CSV ── */
  function exportCsv() {
    var details0 = validCorrs.length > 0 ? (validCorrs[0].details || []) : [];
    var detH = details0.map(function(d) { return "\"" + d.exercice + " (pts)\",\"" + d.exercice + " (remarque)\""; }).join(",");
    var header = "\"Nom\",\"Note /20\",\"Appréciation\",\"Conseil\"" + (detH ? "," + detH : "");
    var rows = validCorrs.map(function(c) {
      var appr = (c.appreciation || "").replace(/"/g, "'");
      var cons = (c.conseil || "").replace(/"/g, "'");
      var base = "\"" + c.name + "\",\"" + c.note + "\",\"" + appr + "\",\"" + cons + "\"";
      var det = details0.map(function(_, i) {
        var d = c.details && c.details[i];
        return d ? "\"" + d.obtenu + "/" + d.sur + "\",\"" + (d.remarque||"").replace(/"/g,"'") + "\"" : "\"\",\"\"";
      }).join(",");
      return base + (det ? "," + det : "");
    });
    var csv = "\uFEFF" + [header].concat(rows).join("\n");
    var a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = "corrections_" + sname.replace(/[^a-z0-9]/gi,"_") + ".csv";
    a.click();
  }

  /* ── Export PDF récap ── */
  function exportRecap() {
    if (!window.jspdf) return;
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
    var M = 15, PW = 180, LH = 6, y = M;
    function addLine(txt, opts) {
      opts = opts || {};
      if (y > 270) { pdf.addPage(); y = M; }
      pdf.setFont("helvetica", opts.bold ? "bold" : "normal");
      pdf.setFontSize(opts.size || 10);
      pdf.setTextColor.apply(pdf, opts.color || [0,0,0]);
      var lines = pdf.splitTextToSize(String(txt || ""), PW);
      pdf.text(lines, M, y);
      y += lines.length * LH + (opts.after || 0);
    }
    addLine("Récapitulatif — " + sname, { bold:true, size:14, after:4 });
    addLine("Moyenne : " + avg.toFixed(1) + "/20", { size:11, color:[80,80,80], after:6 });
    validCorrs.forEach(function(c) {
      if (y > 250) { pdf.addPage(); y = M; }
      pdf.setDrawColor(200,200,200); pdf.line(M, y, M+PW, y); y += 4;
      var col = !isNaN(+c.note) ? (+c.note >= 10 ? [22,163,74] : [220,38,38]) : [0,0,0];
      addLine(c.name + "  —  " + c.note + "/20", { bold:true, size:12, color:col, after:2 });
      addLine(c.appreciation || "", { size:9, color:[80,80,80], after:2 });
      (c.details || []).forEach(function(d) {
        addLine("• " + d.exercice + " : " + d.obtenu + "/" + d.sur + " — " + d.remarque, { size:8.5, color:[60,60,60] });
      });
      if (c.conseil) { y += 2; addLine("Conseil : " + c.conseil, { size:8.5, color:[80,80,180], after:4 }); }
      else { y += 4; }
    });
    pdf.save("recap_" + sname.replace(/[^a-z0-9]/gi,"_") + ".pdf");
  }

              <textarea value={students} onChange={function(e){setStudents(e.target.value);}}

      {/* ═══ STEP 2 : Correction ═══ */}
      {step === 2 && (
        <div>
          {/* Prompt éditable */}
          {corrections.length === 0 && (

                <button onClick={function(){setShowPrompt(!showPrompt);}} style={{fontSize:11,padding:"3px 10px",background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db"}}>

              {showPrompt && (

                  <button onClick={function(){setCorrPrompt(DEFAULT_PROMPT);}} style={{fontSize:11,padding:"3px 10px",background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db",marginTop:6}}>

          {/* Corrigé rendu KaTeX + zone de consignes */}
          {corrections.length === 0 && (
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:14,fontWeight:500}}>📐 Corrigé et barème</span>
                {corrRefLoading && <span style={{fontSize:12,color:"#1d4ed8"}}>⏳ Génération…</span>}
                {!corrRefLoading&&corrRef && <span style={{fontSize:11,color:"#16a34a"}}>✓ Prêt</span>}
              </div>
              {corrRefLoading && <p style={{fontSize:12,color:"#6b7280",textAlign:"center"}}>Génération du corrigé depuis le sujet PDF…</p>}
              {!corrRefLoading&&corrRef && (
                <div>
                  {/* Rendu KaTeX du corrigé */}
                  <div style={{background:"#fff",border:"0.5px solid #e5e7eb",borderRadius:8,padding:"20px 24px",lineHeight:1.8,fontSize:13,maxHeight:400,overflowY:"auto",marginBottom:12}}
                    dangerouslySetInnerHTML={{__html:latexToHtml(corrRef)}}/>

                return (

                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <span style={{fontSize:14,fontWeight:500}}>{s.name}</span>
                      {c && !c.skipped && (
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          {c.pageStart && <Bdg color="info">p.{c.pageStart}–{c.pageEnd}</Bdg>}
                          <span style={{fontSize:22,fontWeight:500,color:nc}}>{c.note}<span style={{fontSize:14,color:"#6b7280"}}>/20</span></span>
                        </div>

                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:14,fontWeight:500}}>{c.name} <span style={{fontSize:11,color:"#9ca3af"}}>(retard)</span></span>
                      <span style={{fontSize:22,fontWeight:500,color:nc}}>{c.note}<span style={{fontSize:14,color:"#6b7280"}}>/20</span></span>
                    </div>
                    <p style={{fontSize:13,color:"#6b7280"}}>{c.appreciation}</p>
                  </Card>
                );
              })}
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <button onClick={function(){resetCorrections();}} style={{flex:1,background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db"}}>
                  ↩ Recommencer
                </button>
                <button disabled={busy||!apiKey} onClick={function(){document.getElementById("late-pdf").click();}} style={{flex:1,background:"#f3f4f6",color:"#1d4ed8",border:"0.5px solid #bfdbfe",fontSize:12}}>
                  ➕ Copie en retard
                </button>
                <input id="late-pdf" type="file" accept="application/pdf" style={{display:"none"}} onChange={function(e){if(e.target.files[0])addLate(e.target.files[0]);}}/>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ═══ STEP 3 : Résultats ═══ */}
      {step === 3 && (
        <Card>
          {/* Aperçu corrigé KaTeX */}
          {corrRef && (
            <div style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:500,marginBottom:8,color:"#374151"}}>
                📐 Aperçu du corrigé — tel que reçu par les élèves
              </div>
              <div style={{background:"#fff",border:"0.5px solid #e5e7eb",borderRadius:8,padding:"20px 24px",lineHeight:1.8,fontSize:13,maxHeight:300,overflowY:"auto"}}
                dangerouslySetInnerHTML={{__html:latexToHtml(corrRef)}}/>
            </div>
          )}
          {!corrRef && (
            <div style={{background:"#fefce8",border:"0.5px solid #fde68a",borderRadius:8,padding:"10px 12px",marginBottom:16,fontSize:12,color:"#92400e"}}>
              ⏳ Corrigé en cours de génération…
            </div>
          )}

          {/* Exports */}
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <button onClick={exportCsv} style={{flex:1,fontSize:12,background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db"}}>📊 CSV</button>
            <button onClick={exportRecap} disabled={!window.jspdf} style={{flex:1,fontSize:12,background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db"}}>📄 PDF récap</button>
          </div>

          {/* Grille des notes */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:16}}>
            {validCorrs.map(function(c) {
              var nc = !isNaN(+c.note)?(+c.note>=10?"#16a34a":"#dc2626"):"#6b7280";
              return (
                <div key={c.id} style={{background:"#f3f4f6",borderRadius:8,padding:12,textAlign:"center"}}>
                  <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>{c.name}</div>
                  <div style={{fontSize:24,fontWeight:500,color:nc,marginBottom:6}}>{c.note}<span style={{fontSize:13,color:"#6b7280"}}>/20</span></div>
                  {mailsDone && c.email && (
                    <button onClick={function(){resendOne(c);}} disabled={resending===c.id||busy}
                      style={{fontSize:10,padding:"2px 8px",background:"#fff",color:resending===c.id?"#9ca3af":"#1d4ed8",border:"0.5px solid #93c5fd",borderRadius:4}}>
                      {resending===c.id?"…":"↩ Renvoyer"}
                    </button>
                  )}
                </div>
              );
            })}
          </div>

          {/* Moyenne */}
          <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:"0.5px solid #e5e7eb"}}>
            <span style={{fontSize:13,color:"#6b7280"}}>Moyenne de classe</span>
            <span style={{fontSize:18,fontWeight:500}}>{validCorrs.length > 0 ? avg.toFixed(1) : "—"}/20</span>
          </div>

          {/* Info envoi */}
          <div style={{background:"#f0fdf4",border:"0.5px solid #86efac",borderRadius:8,padding:"10px 12px",margin:"12px 0",fontSize:12,color:"#166534"}}>
            ✉️ Envoi depuis <strong>maths.perriand@gmail.com</strong> — le corrigé avec les formules est intégré dans chaque mail.<br/>
            Un écran Google s'ouvrira la première fois pour autoriser l'envoi.
          </div>

          {/* Bouton envoi ou succès */}
          {mailsDone ? (
            <div style={{textAlign:"center",padding:"1.5rem"}}>
              <div style={{fontSize:28,marginBottom:8}}>✅</div>
              <span style={{fontWeight:500,color:"#16a34a"}}>Mails envoyés à tous les élèves !</span>
              <p style={{fontSize:11,color:"#9ca3af",marginTop:8}}>Utilisez "↩ Renvoyer" sur chaque carte pour un renvoi individuel.</p>
            </div>
          ) : (
            <div>
              <div style={{fontSize:11,color:"#6b7280",textAlign:"center",margin:"8px 0"}}>
                ⏱ ~{Math.ceil(validCorrs.filter(function(c){return !!c.email;}).length*5/60)+1} min
                &nbsp;·&nbsp; PDF + mail par élève &nbsp;·&nbsp; 0 appel Claude
              </div>
              {busy && progress && (
                <div style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#6b7280",marginBottom:4}}>
                    <span>📬 {progress.label}…</span>
                    <span>{progress.current}/{progress.total}</span>
                  </div>
                  <div style={{background:"#e5e7eb",borderRadius:999,height:6}}>
                    <div style={{background:"#1d4ed8",borderRadius:999,height:6,width:(progress.current/progress.total*100)+"%",transition:"width 0.3s"}}/>
                  </div>
                </div>
              )}
              {busy && status && !progress && <p style={{textAlign:"center",fontSize:12,color:"#1d4ed8",marginBottom:8}}>⏳ {status}</p>}
              <button disabled={busy||corrRefLoading} onClick={sendResults} style={{width:"100%",marginTop:4}}>
                {"📬 Envoyer à " + validCorrs.filter(function(c){return !!c.email;}).length + " élève" + (validCorrs.filter(function(c){return !!c.email;}).length>1?"s":"")}
              </button>
            </div>
          )}
        </Card>
      )}

      {/* Navigation */}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:"1.5rem"}}>
        {step > 0
          ? <button style={{background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db"}} disabled={busy} onClick={function(){setStep(step-1);}}>← Retour</button>
          : <div/>
        }
        {step < 3 && (
          <button disabled={!canNext||busy||!apiKey} onClick={function(){setStep(step+1);}}>
            {["Diffuser →","Corriger les copies →","Voir les résultats →"][step]}
          </button>
        )}
      </div>
      <p style={{textAlign:"center",fontSize:11,color:"#9ca3af",marginTop:"2rem"}}>Powered by Claude (Anthropic)</p>
    </div>
  );
} // fin Devoir

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>
