<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correction Copies - V2 Professionnelle</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .log-console { scroll-behavior: smooth; }
        .log-console::-webkit-scrollbar { width: 8px; }
        .log-console::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- CONSTANTES ET CONFIGURATION ---
        const GMAIL_CLIENT_ID = "3675385834-a42o3cc2lmpasjd8hf23o0jiu6ebbkah.apps.googleusercontent.com";
        const GMAIL_SENDER = "maths.perriand@gmail.com";
        const GMAIL_SCOPE = "https://www.googleapis.com/auth/gmail.send";

        // --- FONCTIONS UTILITAIRES DE SÉCURITÉ ---
        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        const delay = (ms) => new Promise(res => setTimeout(res, ms));

        // --- MOTEUR GEMINI (AVEC BACKOFF EXPONENTIEL ANTI-503) ---
        async function callGemini(apiKey, prompt, base64Pdf = null, logCallback = console.log) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            let retries = 4; // 4 tentatives maximum
            let waitTime = 2000;

            for (let i = 0; i < retries; i++) {
                try {
                    const parts = [];
                    if (base64Pdf) {
                        parts.push({ inlineData: { mimeType: "application/pdf", data: base64Pdf } });
                    }
                    parts.push({ text: prompt });

                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts }],
                            // Force l'IA à renvoyer un JSON valide (Sécurité maximale)
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        if (response.status === 429 || response.status === 503) {
                            throw new Error("SURCHARGE");
                        }
                        throw new Error(errorData.error?.message || `Erreur HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("Réponse vide de l'IA.");
                    
                    return data.candidates[0].content.parts[0].text;

                } catch (error) {
                    if (error.message === "SURCHARGE" || error.message.includes("fetch")) {
                        if (i === retries - 1) throw new Error("Les serveurs Google sont inaccessibles après plusieurs tentatives.");
                        logCallback(`⚠️ Surcharge Google détectée (Tentative ${i+1}/${retries}). Nouvelle tentative dans ${waitTime/1000}s...`);
                        await delay(waitTime);
                        waitTime *= 2; // Attente : 2s, puis 4s, puis 8s...
                    } else {
                        throw error; // Erreur d'un autre type (clé invalide etc.)
                    }
                }
            }
        }

        // --- OUTILS DE FORMATAGE ---
        function cleanJson(text) {
            const matchArray = text.match(/\[[\s\S]*\]/);
            if (matchArray) return matchArray[0];
            const matchObj = text.match(/\{[\s\S]*\}/);
            if (matchObj) return matchObj[0];
            return text;
        }

        function formatLatexToHtml(src) {
            if (!window.katex) return `<pre>${src}</pre>`;
            let html = src;
            
            // Formatage des équations
            html = html.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => {
                try { return `<div style="margin:16px 0;text-align:center">${window.katex.renderToString(m.trim(), { displayMode: true, throwOnError: false })}</div>`; } 
                catch (e) { return `<div>$$${m}$$</div>`; }
            });
            html = html.replace(/\$([^\$\n]+?)\$/g, (_, m) => {
                try { return window.katex.renderToString(m.trim(), { displayMode: false, throwOnError: false }); } 
                catch (e) { return `$${m}$`; }
            });

            // Formatage de la structure texte
            html = html.replace(/\n{2,}/g, '<br/><br/>').replace(/\\textbf\{([^}]+)\}/g, '<strong>$1</strong>');
            return html;
        }

        // --- GMAIL API ---
        let cachedToken = null;
        function getGmailToken() {
            return new Promise((resolve, reject) => {
                if (cachedToken) return resolve(cachedToken);
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: GMAIL_CLIENT_ID,
                    scope: GMAIL_SCOPE,
                    login_hint: GMAIL_SENDER,
                    callback: (resp) => {
                        if (resp.error) return reject(new Error(resp.error));
                        cachedToken = resp.access_token;
                        resolve(cachedToken);
                    },
                    error_callback: (err) => reject(new Error(err.type))
                });
                client.requestAccessToken({ prompt: "select_account" });
            });
        }

        function encodeBase64UTF8(str) { return btoa(unescape(encodeURIComponent(str))); }
        function b64urlMime(asciiStr) { return btoa(asciiStr).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
        function wrapBase64(str) { return str.match(/.{1,76}/g)?.join("\r\n") || ""; }

        async function sendMailWithAttachment(to, subject, bodyText, pdfBase64, filename) {
            const token = await getGmailToken();
            const boundary = "boundary_" + Math.random().toString(36).slice(2);
            
            const mimeParts = [
                `From: ${GMAIL_SENDER}`,
                `To: ${to}`,
                `Subject: =?UTF-8?B?${encodeBase64UTF8(subject)}?=`,
                "MIME-Version: 1.0",
                `Content-Type: multipart/mixed; boundary="${boundary}"`,
                "",
                `--${boundary}`,
                "Content-Type: text/plain; charset=utf-8",
                "Content-Transfer-Encoding: base64",
                "",
                encodeBase64UTF8(bodyText),
                "",
                `--${boundary}`,
                `Content-Type: application/pdf; name="${filename}"`,
                "Content-Transfer-Encoding: base64",
                `Content-Disposition: attachment; filename="${filename}"`,
                "",
                wrapBase64(pdfBase64),
                "",
                `--${boundary}--`
            ].join("\r\n");

            const raw = b64urlMime(mimeParts);

            const res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
                method: "POST",
                headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
                body: JSON.stringify({ raw })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || "Erreur d'envoi Gmail");
            }
        }

        // --- COMPOSANT PRINCIPAL REACT ---
        function App() {
            const [step, setStep] = useState(1);
            const [apiKey, setApiKey] = useState(localStorage.getItem("gemini_key_v2") || "");
            const [subject, setSubject] = useState("");
            
            const [mergedPdfBase64, setMergedPdfBase64] = useState(null);
            const [numPages, setNumPages] = useState(0);
            
            const [studentMap, setStudentMap] = useState([]); // [{nom, email, start, end}]
            const [corrections, setCorrections] = useState([]); // Résultats finaux
            
            const [logs, setLogs] = useState([]);
            const [isWorking, setIsWorking] = useState(false);

            const log = (msg) => setLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] ${msg}`]);

            // Étape 1 : Chargement et Cartographie
            const handlePdfUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    setIsWorking(true);
                    log("Lecture du PDF...");
                    const b64 = await getBase64(file);
                    setMergedPdfBase64(b64);

                    const pdfDoc = await window.PDFLib.PDFDocument.load(b64);
                    const pagesCount = pdfDoc.getPageCount();
                    setNumPages(pagesCount);
                    log(`PDF chargé : ${pagesCount} pages.`);
                } catch (err) {
                    log("❌ Erreur PDF: " + err.message);
                } finally {
                    setIsWorking(false);
                }
            };

            const mapStudents = async () => {
                if (!apiKey || !mergedPdfBase64) return alert("Clé API et PDF requis.");
                setIsWorking(true);
                setLogs([]);
                log("🚀 Lancement de la cartographie (Étape 1/2)...");
                
                try {
                    const prompt = `Voici un PDF contenant des copies de mathématiques (total ${numPages} pages). 
Chaque élève a écrit son adresse email sur sa copie. 
Ta mission : Identifie chaque élève, son email, et la plage de pages de sa copie.
Renvoie STRICTEMENT un tableau JSON plat, sans markdown.
Format attendu : [{"nom": "Prénom Nom", "email": "adresse@mail.com", "pageStart": 1, "pageEnd": 2}]`;
                    
                    log("Analyse globale par Gemini en cours...");
                    const rawJson = await callGemini(apiKey, prompt, mergedPdfBase64, log);
                    
                    const parsed = JSON.parse(cleanJson(rawJson));
                    if (!Array.isArray(parsed)) throw new Error("Le format renvoyé n'est pas un tableau.");
                    
                    setStudentMap(parsed);
                    log(`✅ Cartographie terminée : ${parsed.length} élèves identifiés.`);
                    setStep(2);
                    
                } catch (err) {
                    log("❌ Échec de la cartographie : " + err.message);
                } finally {
                    setIsWorking(false);
                }
            };

            // Étape 2 : Découpage et Correction individuelle
            const processCorrections = async () => {
                if (!subject) return alert("Veuillez renseigner le sujet de l'évaluation.");
                setIsWorking(true);
                log("🚀 Démarrage de la correction individuelle par lots...");
                
                const results = [];
                const pdfDoc = await window.PDFLib.PDFDocument.load(mergedPdfBase64);

                for (let i = 0; i < studentMap.length; i++) {
                    const student = studentMap[i];
                    log(`➡️ Traitement de la copie de ${student.nom} (${i+1}/${studentMap.length})...`);
                    
                    try {
                        // 1. Découpage du PDF pour cet élève spécifique
                        const subPdf = await window.PDFLib.PDFDocument.create();
                        const indices = [];
                        for(let p = student.pageStart - 1; p < student.pageEnd; p++) {
                            if(p >= 0 && p < numPages) indices.push(p);
                        }
                        
                        const copiedPages = await subPdf.copyPages(pdfDoc, indices);
                        copiedPages.forEach(page => subPdf.addPage(page));
                        const subPdfBytes = await subPdf.save();
                        const subPdfB64 = window.btoa(String.fromCharCode(...new Uint8Array(subPdfBytes)));

                        // 2. Appel à Gemini pour correction (Format JSON imposé)
                        const promptCorrection = `Voici la copie de ${student.nom} (${student.email}).
SUJET : ${subject}
Corrige avec bienveillance. Tutoie l'élève en utilisant uniquement son prénom.
Retourne STRICTEMENT un objet JSON (sans bloc markdown) avec cette structure exacte :
{"note": 14, "appreciation": "Bon travail...", "conseil": "Revois...", "details": [{"exercice": "Ex 1", "obtenu": 4, "sur": 5, "remarque": "..."}]}`;

                        log(`Envoi de la copie de ${student.nom} à l'IA...`);
                        const rawResult = await callGemini(apiKey, promptCorrection, subPdfB64, log);
                        const correctionData = JSON.parse(cleanJson(rawResult));
                        
                        results.push({ ...student, ...correctionData });
                        log(`✅ ${student.nom} corrigé : ${correctionData.note}/20.`);

                        // 3. Pause de courtoisie pour éviter le Rate Limiting (Quotas)
                        if (i < studentMap.length - 1) {
                            log("Pause de 3s pour stabiliser l'API...");
                            await delay(3000);
                        }

                    } catch (err) {
                        log(`❌ Erreur pour ${student.nom} : ${err.message}`);
                        results.push({ ...student, error: err.message, note: "ERR" });
                    }
                }

                setCorrections(results);
                log("🎉 Toutes les corrections sont terminées !");
                setStep(3);
                setIsWorking(false);
            };

            // Étape 3 : Création du PDF individuel et Envoi Gmail
            const sendEmails = async () => {
                setIsWorking(true);
                log("🚀 Préparation et envoi des rapports...");

                try {
                    log("Connexion à Gmail...");
                    await getGmailToken();
                } catch(e) {
                    log("❌ Connexion Gmail refusée.");
                    setIsWorking(false);
                    return;
                }

                for (let i = 0; i < corrections.length; i++) {
                    const c = corrections[i];
                    if (c.error || !c.email || c.email === "inconnu@mail.com") {
                        log(`⚠️ Saut de l'envoi pour ${c.nom} (Email invalide ou erreur de correction)`);
                        continue;
                    }

                    log(`Génération du PDF de ${c.nom}...`);
                    
                    try {
                        // FIX PAGES BLANCHES : Création d'un div caché mais "rendu" physiquement
                        const container = document.createElement("div");
                        container.style.position = "absolute";
                        container.style.left = "-9999px"; // Hors de l'écran
                        container.style.top = "0";
                        container.style.width = "800px";
                        container.style.backgroundColor = "#ffffff";
                        container.style.padding = "40px";
                        container.style.color = "#000000";
                        container.style.fontFamily = "sans-serif";
                        
                        const detailsHtml = (c.details || []).map(d => `
                            <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
                                <strong>${d.exercice}</strong> : ${d.obtenu}/${d.sur} points<br/>
                                <span style="color:#555; font-size:14px">${d.remarque}</span>
                            </div>
                        `).join("");

                        container.innerHTML = `
                            <h1 style="color:#1e40af; border-bottom:2px solid #1e40af; padding-bottom:10px;">Bilan de Mathématiques</h1>
                            <div style="font-size:18px; margin: 20px 0;"><strong>Élève :</strong> ${c.nom}</div>
                            <div style="font-size:24px; font-weight:bold; color: ${c.note >= 10 ? '#16a34a' : '#dc2626'}; text-align:center; padding:20px; background:#f8fafc; border-radius:8px;">
                                NOTE : ${c.note} / 20
                            </div>
                            <div style="margin:20px 0; font-size:16px;"><strong>Appréciation globale :</strong><br/><i>${c.appreciation}</i></div>
                            <h3 style="margin-top:30px; color:#333;">Détails de la copie :</h3>
                            ${detailsHtml}
                            <div style="margin-top:30px; background:#eff6ff; padding:15px; border-radius:8px; border-left:4px solid #3b82f6;">
                                <strong>💡 Conseil du professeur :</strong><br/>${c.conseil}
                            </div>
                        `;

                        document.body.appendChild(container);
                        
                        // FIX: Attente absolue pour que le CSS et les polices se chargent (Fin des pages blanches)
                        await delay(1000); 

                        const canvas = await window.html2canvas(container, { scale: 2, useCORS: true, logging: false });
                        document.body.removeChild(container);

                        const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
                        const imgProps = pdf.getImageProperties(canvas);
                        const pdfWidth = pdf.internal.pageSize.getWidth() - 30; // Marges
                        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                        
                        pdf.addImage(canvas.toDataURL("image/png"), "PNG", 15, 15, pdfWidth, pdfHeight);
                        const pdfB64 = pdf.output("datauristring").split(',')[1];

                        log(`Envoi du mail à ${c.email}...`);
                        const prenom = c.nom.split(" ")[0];
                        const mailBody = `Bonjour ${prenom},\n\nVoici le bilan de ton dernier devoir de mathématiques.\n\nTa note est de ${c.note}/20.\nTu trouveras tes corrections détaillées dans le PDF ci-joint.\n\nCordialement,\nF. Nocca`;
                        
                        await sendMailWithAttachment(c.email, "Résultats : Devoir de Mathématiques", mailBody, pdfB64, `Correction_${prenom}.pdf`);
                        log(`✅ Mail envoyé à ${c.nom}.`);

                    } catch (e) {
                        log(`❌ Erreur d'envoi pour ${c.nom} : ${e.message}`);
                    }
                }

                log("🎉 Campagne d'envoi terminée !");
                setIsWorking(false);
            };

            // --- INTERFACE UTILISATEUR ---
            return (
                <div className="container">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-slate-800">📐 Devoirs Maths <span className="text-sm font-normal bg-blue-100 text-blue-700 px-3 py-1 rounded-full">Pro V2</span></h1>
                        <span className="text-sm text-slate-500">Moteur Infaillible (Anti-503)</span>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Panneau de Contrôle */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* CONFIGURATION */}
                            <div className="card">
                                <h2 className="text-xl font-bold mb-4 border-b pb-2">⚙️ Configuration</h2>
                                <div className="input-group">
                                    <label>Clé API Gemini (Pro 1.5 recommandé) :</label>
                                    <input type="password" value={apiKey} onChange={(e) => {setApiKey(e.target.value); localStorage.setItem("gemini_key_v2", e.target.value);}} placeholder="AIzaSy..." />
                                </div>
                                <div className="input-group">
                                    <label>Le sujet / Le barème (Texte ou LaTeX) :</label>
                                    <textarea className="w-full p-3 border border-slate-300 rounded-md h-32 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                              value={subject} onChange={e => setSubject(e.target.value)}
                                              placeholder="Ex: Exercice 1 sur les suites (5 pts), Exercice 2 probabilités (10 pts)..."></textarea>
                                </div>
                            </div>

                            {/* ETAPE 1 : UPLOAD */}
                            {step === 1 && (
                                <div className="card border-l-4 border-l-blue-500">
                                    <h2 className="text-xl font-bold mb-4">Étape 1 : Cartographie</h2>
                                    <p className="text-sm text-slate-600 mb-4">Déposez votre PDF contenant <strong>toutes les copies scannées</strong>. L'IA va isoler chaque élève et lire son email inscrit sur l'en-tête.</p>
                                    <input type="file" accept="application/pdf" onChange={handlePdfUpload} className="mb-4 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                                    <button onClick={mapStudents} disabled={isWorking || !mergedPdfBase64} className="w-full shadow-md">
                                        {isWorking ? "Analyse globale en cours..." : "📌 Analyser et Extraire les noms"}
                                    </button>
                                </div>
                            )}

                            {/* ETAPE 2 : CORRECTION */}
                            {step === 2 && (
                                <div className="card border-l-4 border-l-amber-500">
                                    <h2 className="text-xl font-bold mb-4">Étape 2 : Lancement des Corrections</h2>
                                    <div className="bg-slate-50 p-4 rounded-md mb-4 text-sm max-h-48 overflow-y-auto">
                                        <strong>Copies détectées ({studentMap.length}) :</strong><br/>
                                        {studentMap.map((s, i) => <div key={i} className="py-1 border-b border-slate-200">📄 {s.nom} ({s.email}) - Pages {s.pageStart} à {s.pageEnd}</div>)}
                                    </div>
                                    <p className="text-sm text-slate-600 mb-4">Le système va maintenant découper le PDF et corriger chaque élève individuellement (avec pause de sécurité anti-surcharge).</p>
                                    <button onClick={processCorrections} disabled={isWorking} className="w-full shadow-md bg-amber-500 hover:bg-amber-600">
                                        {isWorking ? "Corrections en cours (Ne pas fermer)..." : "🤖 Lancer la correction individuelle"}
                                    </button>
                                </div>
                            )}

                            {/* ETAPE 3 : RESULTATS */}
                            {step === 3 && (
                                <div className="card border-l-4 border-l-emerald-500">
                                    <h2 className="text-xl font-bold mb-4">Étape 3 : Validation et Envoi</h2>
                                    
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                        {corrections.map((c, i) => (
                                            <div key={i} className={`p-3 rounded-lg border text-center ${c.error ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200'}`}>
                                                <div className="text-xs text-slate-500 truncate">{c.nom}</div>
                                                <div className={`text-xl font-bold ${c.note >= 10 ? 'text-emerald-600' : 'text-red-600'}`}>{c.note}/20</div>
                                            </div>
                                        ))}
                                    </div>

                                    <button onClick={sendEmails} disabled={isWorking} className="w-full shadow-md bg-emerald-600 hover:bg-emerald-700">
                                        {isWorking ? "Création des PDFs et Envoi..." : "📬 Générer et Envoyer les Rapports par Email"}
                                    </button>
                                    <button onClick={() => setStep(1)} disabled={isWorking} className="w-full mt-3 bg-slate-200 text-slate-700 hover:bg-slate-300">
                                        Recommencer un devoir
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Console de Logs */}
                        <div className="card bg-slate-900 text-slate-300 h-[600px] flex flex-col">
                            <h2 className="text-sm font-bold text-slate-400 mb-2 border-b border-slate-700 pb-2 uppercase tracking-wider">🖥️ Terminal Console</h2>
                            <div className="log-console flex-1 overflow-y-auto font-mono text-[11px] leading-relaxed">
                                {logs.length === 0 ? <span className="text-slate-600">Système en attente...</span> : null}
                                {logs.map((l, i) => (
                                    <div key={i} className={`mb-1 ${l.includes('❌') ? 'text-red-400' : l.includes('✅') ? 'text-emerald-400' : l.includes('⚠️') ? 'text-amber-400' : 'text-sky-300'}`}>
                                        {l}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
