  <script type="text/babel">
    const { useState, useCallback, useEffect, useRef } = React;
    const STEPS = ["📝 Sujet", "👥 Élèves", "🎯 Corrigé & Barème", "✏️ Correction", "📬 Résultats"];

    /* ── Gmail OAuth & Utilities ── */
    const GMAIL_CLIENT_ID = "3675385834-a42o3cc2lmpasjd8hf23o0jiu6ebbkah.apps.googleusercontent.com";
    const GMAIL_SENDER    = "maths.perriand@gmail.com";
    const GMAIL_SCOPE     = "https://www.googleapis.com/auth/gmail.send";

    let gmailAccessToken = null;

    function getGmailToken() {
      return new Promise((resolve, reject) => {
        if (gmailAccessToken) { resolve(gmailAccessToken); return; }
        if (!window.google?.accounts?.oauth2) {
          reject(new Error("Google Identity Services non chargé. Vérifiez votre connexion.")); return;
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) { settled = true; reject(new Error("Délai d'autorisation dépassé.")); }
        }, 120000);
        const client = window.google.accounts.oauth2.initTokenClient({
          client_id: GMAIL_CLIENT_ID,
          scope: GMAIL_SCOPE,
          login_hint: GMAIL_SENDER,
          callback: (resp) => {
            clearTimeout(timer);
            if (settled) return;
            settled = true;
            if (resp.error) { reject(new Error(resp.error)); return; }
            gmailAccessToken = resp.access_token;
            setTimeout(() => { gmailAccessToken = null; }, (resp.expires_in - 60) * 1000);
            resolve(gmailAccessToken);
          },
          error_callback: (err) => {
            clearTimeout(timer);
            if (!settled) { settled = true; reject(new Error(err.type || "Autorisation refusée")); }
          }
        });
        client.requestAccessToken({ prompt: "select_account" });
      });
    }

    async function mergePdfs(pdfList) {
      if (pdfList.length === 1) return pdfList[0].b64;
      const { PDFDocument } = window.PDFLib;
      const merged = await PDFDocument.create();
      for (const p of pdfList) {
        const bytes = Uint8Array.from(atob(p.b64), c => c.charCodeAt(0));
        const doc   = await PDFDocument.load(bytes);
        const pages = await merged.copyPages(doc, doc.getPageIndices());
        pages.forEach(pg => merged.addPage(pg));
      }
      const bytes = await merged.save();
      return uint8ToBase64(bytes);
    }

    function uint8ToBase64(bytes) {
      let binary = "";
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function b64url(str) {
      return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    }

    function chunkBase64(str) {
      if (!str) return "";
      const chunks = [];
      for (let i = 0; i < str.length; i += 76) chunks.push(str.substring(i, i + 76));
      return chunks.join("\r\n");
    }

    function buildMimeWithPdf(to, subject, body, pdfBase64, pdfFilename) {
      const boundary = "boundary_" + Math.random().toString(36).slice(2);
      const parts = [
        `From: ${GMAIL_SENDER}`,
        `To: ${to}`,
        `Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,
        "MIME-Version: 1.0",
        `Content-Type: multipart/mixed; boundary="${boundary}"`,
        "",
        `--${boundary}`,
        "Content-Type: text/plain; charset=utf-8",
        "Content-Transfer-Encoding: base64",
        "",
        chunkBase64(btoa(unescape(encodeURIComponent(body)))),
        "",
        `--${boundary}`,
        `Content-Type: application/pdf; name="${pdfFilename}"`,
        "Content-Transfer-Encoding: base64",
        `Content-Disposition: attachment; filename="${pdfFilename}"`,
        "",
        chunkBase64(pdfBase64),
        "",
        `--${boundary}--`
      ].join("\r\n");
      return b64url(parts);
    }

    async function sendGmail(to, subject, body, pdfBase64, pdfFilename) {
      const token = await getGmailToken();
      const raw   = buildMimeWithPdf(to, subject, body, pdfBase64, pdfFilename);
      const res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ raw }),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || "Erreur Gmail");
      }
    }

    /* ── Gestionnaire de sessions ── */
    const ROOT = "prof_maths_sessions";
    const ACTIVE_KEY = "prof_maths_active";

    function getAllSessions() { try { return JSON.parse(localStorage.getItem(ROOT) || "{}"); } catch { return {}; } }
    function saveSession(id, data) { const all = getAllSessions(); all[id] = data; localStorage.setItem(ROOT, JSON.stringify(all)); }
    function getSession(id) { return getAllSessions()[id] || {}; }
    function deleteSession(id) {
      const all = getAllSessions(); delete all[id]; localStorage.setItem(ROOT, JSON.stringify(all));
      if (localStorage.getItem(ACTIVE_KEY) === id) localStorage.removeItem(ACTIVE_KEY);
    }
    function getActiveId() { return localStorage.getItem(ACTIVE_KEY) || null; }
    function setActiveId(id) { localStorage.setItem(ACTIVE_KEY, id); }
    function newSessionId() { return "s_" + Date.now(); }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    /* ── API Google Gemini Sécurisée avec 30 tentatives (Anti-503 absolu) ── */
    async function callGemini(apiKey, parts, systemInstruction = null, jsonMode = false, model = "gemini-2.5-flash", onRetryNotify = null) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const body = { contents: [{ parts: parts }] };
      
      const generationConfig = { temperature: 0.1 }; 
      if (jsonMode) generationConfig.responseMimeType = "application/json";
      
      body.generationConfig = generationConfig;
      if (systemInstruction) body.systemInstruction = { parts: [{ text: systemInstruction }] };

      let attempt = 0;
      const maxAttempts = 30; // AUGMENTATION MASSIVE: Ne lâche jamais l'affaire sur un 503
      let backoffDelay = 5000;

      while (attempt < maxAttempts) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (res.status === 429 || res.status === 503) {
            attempt++;
            if (attempt >= maxAttempts) throw new Error(`Google est saturé (${res.status}). Veuillez réessayer plus tard.`);
            if (onRetryNotify) onRetryNotify(`Google saturé (${res.status}). Tentative ${attempt}/${maxAttempts} dans ${Math.round(backoffDelay / 1000)}s...`);
            await delay(backoffDelay);
            backoffDelay = Math.min(backoffDelay * 1.5, 20000); // Plafond à 20s pour marteler sans bloquer
            continue;
          }

          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        } catch (error) {
          const msg = error.message?.toLowerCase() || "";
          if (msg.includes("429") || msg.includes("503") || msg.includes("high demand") || msg.includes("quota") || msg.includes("fetch")) {
            attempt++;
            if (attempt >= maxAttempts) throw error;
            if (onRetryNotify) onRetryNotify(`Surcharge détectée. Reprise dans ${Math.round(backoffDelay / 1000)}s...`);
            await delay(backoffDelay);
            backoffDelay = Math.min(backoffDelay * 1.5, 20000);
            continue;
          }
          throw error;
        }
      }
    }

    function parseStudents(raw) {
      return raw.trim().split("\n").filter(Boolean).map((line, i) => {
        const [name, email] = line.split(",").map(s => s.trim());
        return { id: i, name: name || `Élève ${i+1}`, email: email || "" };
      });
    }

    function safeJSONParse(rawText) {
      try {
        let cleanRaw = rawText.trim();
        if (cleanRaw.startsWith('```json')) cleanRaw = cleanRaw.replace(/^```json/, '').replace(/```$/, '').trim();
        else if (cleanRaw.startsWith('```')) cleanRaw = cleanRaw.replace(/^```/, '').replace(/```$/, '').trim();

        // RÉPARATION JSON MAGIQUE:
        // L'IA oublie souvent de doubler les antislashs LaTeX en JSON. "\frac" devient "frac" (car \f = form feed).
        // Cette ligne repère les commandes LaTeX classiques précédées d'un seul antislash et le double.
        cleanRaw = cleanRaw.replace(/([^\\])\\(frac|times|text|begin|end|sqrt|left|right|alpha|beta|gamma|theta|pi|int|sum|lim|infty|quad|to|implies|equiv|cdot|ldots|vdots|ddots|le|ge)/g, '$1\\\\$2');

        return JSON.parse(cleanRaw);
      } catch (error) {
        console.error("Erreur de parsing JSON :", error, rawText);
        throw new Error("L'IA a renvoyé un format illisible. Essayez de relancer.");
      }
    }

    /* ── PARSEUR LATEX OPTIMISÉ (Arbres, Tableaux & Protection Anti-Casse) ── */
    function latexToHtml(src) {
      if (!src) return "";
      if (!window.katex) return `<pre>${src}</pre>`;

      // 1. SAUVETAGE DES ARBRES ET TABLEAUX
      // KaTeX déteste \begin{tabular}, il exige \begin{array}. On convertit à la volée !
      let text = src.replace(/\\begin\{tabular\}(\{[^}]*\})?/g, '\\begin{array}$1')
                    .replace(/\\end\{tabular\}/g, '\\end{array}');

      const mathBlocks = [];

      // 2. EXTRACTION ET PROTECTION DES MATHS AVANT LE PARSING MARKDOWN
      text = text.replace(/\$\$([\s\S]+?)\$\$/g, (match, eq) => {
        mathBlocks.push({ mode: 'display', eq }); return `__MATH_${mathBlocks.length - 1}__`;
      });
      text = text.replace(/\\\[([\s\S]+?)\\\]/g, (match, eq) => {
        mathBlocks.push({ mode: 'display', eq }); return `__MATH_${mathBlocks.length - 1}__`;
      });
      text = text.replace(/\\\(([\s\S]+?)\\\)/g, (match, eq) => {
        mathBlocks.push({ mode: 'inline', eq }); return `__MATH_${mathBlocks.length - 1}__`;
      });
      text = text.replace(/\$([^\$\n]+?)\$/g, (match, eq) => {
        mathBlocks.push({ mode: 'inline', eq }); return `__MATH_${mathBlocks.length - 1}__`;
      });
      text = text.replace(/\\begin\{(aligned|array|pmatrix|bmatrix|vmatrix|cases)\}([\s\S]*?)\\end\{\1\}/g, (match) => {
        mathBlocks.push({ mode: 'display', eq: match }); return `__MATH_${mathBlocks.length - 1}__`;
      });

      // 3. MISE EN FORME DU TEXTE (Structure LaTeX vers HTML)
      text = text
        .replace(/\\section\*?\{([^}]+)\}/g, '<h2 style="font-size:16pt; color:#1d4ed8; margin-top:28px; margin-bottom:14px; border-bottom:1px solid #bfdbfe; padding-bottom:6px;">$1</h2>')
        .replace(/\\subsection\*?\{([^}]+)\}/g, '<h3 style="font-size:14pt; color:#374151; margin-top:20px; margin-bottom:10px;">$1</h3>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\\textbf\{([^}]+)\}/g, '<strong>$1</strong>')
        .replace(/\\textit\{([^}]+)\}/g, '<em>$1</em>')
        .replace(/\\underline\{([^}]+)\}/g, '<u>$1</u>')
        .replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g, (_, body) =>
          `<ol style="padding-left:24px; margin:12px 0;">${body.replace(/\\item\s+/g,'<li>').replace(/<li>([^<]*)/g,'<li>$1</li>')}</ol>`)
        .replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g, (_, body) =>
          `<ul style="padding-left:24px; margin:12px 0;">${body.replace(/\\item\s+/g,'<li>').replace(/<li>([^<]*)/g,'<li>$1</li>')}</ul>`)
        .replace(/\\newline/g, '<br/>')
        .replace(/\n\n/g, '</p><p style="margin:12px 0; line-height:1.7;">')
        .replace(/\n/g, '<br/>');

      // 4. RÉINJECTION DES MATHS COMPILÉES PAR KATEX
      text = text.replace(/__MATH_(\d+)__/g, (match, idx) => {
        const block = mathBlocks[idx];
        try {
          // strict: false permet à KaTeX d'être tolérant avec les petites erreurs d'espacement de l'IA
          if (block.mode === 'display') {
            return `<div class="math-block-container" style="overflow-x:auto; text-align:center;">${window.katex.renderToString(block.eq, { displayMode: true, throwOnError: false, strict: false })}</div>`;
          } else {
            return window.katex.renderToString(block.eq, { displayMode: false, throwOnError: false, strict: false });
          }
        } catch(e) {
          return `<span style="color:#dc2626; font-weight:bold;">[Erreur LaTeX: $${block.eq}$]</span>`;
        }
      });

      return '<p style="margin:12px 0; line-height:1.7; font-size:15px;">' + text + '</p>';
    }

    /* ── UI Components ── */
    function Card({ children }) { return <div style={{ background:"#fff", border:"0.5px solid #e5e7eb", borderRadius:10, padding:"1.25rem", marginBottom:"1rem", boxShadow:"0 1px 2px rgba(0,0,0,0.05)" }}>{children}</div>; }
    function Field({ label, children }) { return <div style={{ marginBottom:12 }}><span style={{ display:"block", fontSize:13, fontWeight:500, color:"#374151", marginBottom:6 }}>{label}</span>{children}</div>; }
    function SectionHead({ title, right }) { return <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}><span style={{ fontSize:15, fontWeight:600 }}>{title}</span>{right}</div>; }

    /* ── SessionManager ── */
    function SessionManager({ onSelect }) {
      const [sessions, setSessions] = useState(() => getAllSessions());
      const [newName,  setNewName]  = useState("");
      const refresh = () => setSessions(getAllSessions());

      const create = () => {
        const name = newName.trim() || "Devoir du " + new Date().toLocaleDateString("fr-FR");
        const id = newSessionId();
        saveSession(id, { name, createdAt: Date.now() });
        setNewName(""); refresh(); onSelect(id, name);
      };

      const entries = Object.entries(sessions).sort((a,b) => (b[1].createdAt||0)-(a[1].createdAt||0));
      return (
        <div style={{ maxWidth:700, margin:"0 auto", padding:"2rem 1rem" }}>
          <h1 style={{ marginBottom:8 }}>📐 Gestionnaire de devoirs (Gemini)</h1>
          <p style={{ fontSize:14, color:"#6b7280", marginBottom:"2rem" }}>Un outil optimisé pour les enseignants en mathématiques.</p>

          <Card>
            <div style={{ fontSize:15, fontWeight:600, marginBottom:12 }}>➕ Nouveau devoir</div>
            <div style={{ display:"flex", gap:10 }}>
              <input type="text" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Ex : Contrôle Fonctions - 1ère Spé" onKeyDown={e=>e.key==="Enter"&&create()} style={{ flex:1, padding:"10px 14px" }}/>
              <button onClick={create} style={{ flexShrink:0, background:"#16a34a", padding:"0 20px" }}>Créer</button>
            </div>
          </Card>

          {entries.length > 0 && (
            <Card>
              <div style={{ fontSize:15, fontWeight:600, marginBottom:12 }}>📂 Devoirs récents</div>
              {entries.map(([id, s]) => (
                <div key={id} onClick={()=>onSelect(id, s.name)} style={{
                  display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 14px", marginBottom:8, borderRadius:8, cursor:"pointer", background:"#f9fafb", border:"1px solid #e5e7eb", transition:"all 0.2s",
                }} onMouseEnter={e=>{e.currentTarget.style.background="#f3f4f6"; e.currentTarget.style.borderColor="#d1d5db";}} onMouseLeave={e=>{e.currentTarget.style.background="#f9fafb"; e.currentTarget.style.borderColor="#e5e7eb";}}>
                  <div>
                    <div style={{ fontWeight:600, fontSize:14, color:"#111827" }}>{s.name}</div>
                    <div style={{ fontSize:12, color:"#6b7280", marginTop:4 }}>
                      Créé le {s.createdAt ? new Date(s.createdAt).toLocaleDateString("fr-FR") : ""}
                      {s.corrections?.length > 0 ? ` • ${s.corrections.filter(c=>!c.skipped).length} copies traitées` : ""}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                    <span style={{ fontSize:13, color:"#1d4ed8", fontWeight:600 }}>Ouvrir →</span>
                    <span onClick={e=>{e.stopPropagation(); if(window.confirm("Supprimer ce devoir ?")) { deleteSession(id); refresh(); }}} style={{ fontSize:14, color:"#9ca3af", padding:"4px 8px" }}>✕</span>
                  </div>
                </div>
              ))}
            </Card>
          )}
        </div>
      );
    }

    function App() {
      const [sessionId, setSessionId] = useState(null);
      const [sessionName, setSessionName] = useState("");
      if (!sessionId) return <SessionManager onSelect={(id, name) => { setActiveId(id); setSessionId(id); setSessionName(name); }}/>;
      return <Devoir sessionId={sessionId} sessionName={sessionName} onBack={()=>{ setSessionId(null); setSessionName(""); }}/>;
    }

    /* ── DEVOIR APP ── */
    function Devoir({ sessionId, sessionName, onBack }) {
      const load = (key, fallback) => { const s=getSession(sessionId); return s[key]!==undefined?s[key]:fallback; };
      const persist = (key, val) => { const s=getSession(sessionId); s[key]=val; saveSession(sessionId, {...getAllSessions()[sessionId],...s,[key]:val}); };

      const [apiKey, setApiKey] = useState(() => { try{return localStorage.getItem("prof_maths_gemini_apikey")||"";}catch{return "";} });
      const [modelChoice, setModelChoiceRaw] = useState(() => load("modelChoice", "gemini-2.5-flash"));
      const [step, setStepRaw] = useState(() => load("step", 0));
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState("");
      const [progress, setProgress] = useState(0); 
      const [libsOk, setLibsOk] = useState({ h2c: !!window.html2canvas, jspdf: !!window.jspdf });

      useEffect(()=>{ try{localStorage.setItem("prof_maths_gemini_apikey",apiKey);}catch{} },[apiKey]);
      const setModelChoice = v => { setModelChoiceRaw(v); persist("modelChoice", v); };
      const setStep = v => { setStepRaw(v); persist("step",v); };

      /* Etapes Datas */
      const [upSubPdf, setUpSubPdf] = useState(null);
      const [upSubPdfName, setUpSubPdfNameRaw] = useState(() => load("upSubPdfName", ""));
      const setUpSubPdfName = v => { setUpSubPdfNameRaw(v); persist("upSubPdfName",v); };

      const [studentsRaw, setStudentsRawRaw] = useState(() => load("studentsRaw", ""));
      const setStudentsRaw = v => { setStudentsRawRaw(v); persist("studentsRaw",v); };
      const [copiesPdfs, setCopiesPdfsRaw] = useState([]);
      const setCopiesPdfs = (v) => { if (typeof v === 'function') { setCopiesPdfsRaw(prev => { const next = v(prev); persist("copiesPdfsCount", next.length); return next; }); } else { setCopiesPdfsRaw(v); persist("copiesPdfsCount", v.length); } };

      /* LE CORRIGÉ DE RÉFÉRENCE */
      const [masterCorrection, setMasterCorrectionRaw] = useState(() => load("masterCorrection", ""));
      const setMasterCorrection = v => { setMasterCorrectionRaw(v); persist("masterCorrection", v); };
      const [userDirectives, setUserDirectivesRaw] = useState(() => load("userDirectives", ""));
      const setUserDirectives = v => { setUserDirectivesRaw(v); persist("userDirectives", v); };

      const [corrections, setCorrectionsRaw] = useState(() => load("corrections", []));
      const setCorrections = v => { if (typeof v === 'function') { setCorrectionsRaw(prev => { const next = v(prev); persist("corrections", next); return next; }); } else { setCorrectionsRaw(v); persist("corrections", v); } };
      const updateCorrection = (id, field, value) => setCorrections(prev => prev.map(c => c.id === id ? { ...c, [field]: value } : c));

      const [mailsDone, setMailsDoneRaw] = useState(() => load("mailsDone", false));
      const setMailsDone = v => { setMailsDoneRaw(v); persist("mailsDone",v); };

      useEffect(()=>{
        const t = setInterval(() => setLibsOk({ h2c:!!window.html2canvas, jspdf:!!window.jspdf }), 500); return () => clearInterval(t);
      },[]);

      const students = parseStudents(studentsRaw);
      const validCorrs = corrections.filter(c=>!c.skipped);
      const avg = validCorrs.filter(c=>!isNaN(+c.note)).reduce((a,c,_,arr)=>a+ +c.note/arr.length,0);
      
      const canNext = [!!upSubPdf, students.length > 0, !!masterCorrection, corrections.length>0, true][step];

      const readPdf = (file, cb) => { const r = new FileReader(); r.onload = e => cb(e.target.result.split(",")[1]); r.readAsDataURL(file); };

      const handleSubjectPdf = (file) => {
        if (!file||file.type!=="application/pdf") return;
        setUpSubPdfName(file.name);
        readPdf(file, b64 => setUpSubPdf(b64));
      };

      const addCopiesPdf = (files) => {
        const arr = Array.from(files).filter(f=>f.type==="application/pdf");
        if (!arr.length) return;
        let loaded = 0, firstB64 = null;
        arr.forEach(file => {
          readPdf(file, b64 => {
            if (loaded === 0) firstB64 = b64;
            setCopiesPdfs(prev => [...prev, {name: file.name, b64}]);
            loaded++;
            if (loaded === arr.length && firstB64 && students.length === 0) extractNames(firstB64);
          });
        });
      };

      const extractNames = async (b64) => {
        if (!b64 || !apiKey) return;
        setBusy(true); setStatus("Extraction automatique des profils élèves...");
        try {
          const parts = [
            { inlineData: { mimeType: "application/pdf", data: b64 } },
            { text: "Extrais le nom complet et l'email de chaque élève présent. Retourne uniquement un JSON pur: [{name, email}]." }
          ];
          const raw = await callGemini(apiKey, parts, "Extrais en JSON pur, sans markdown.", true, "gemini-2.5-flash", (msg) => setStatus(msg));
          const arr = safeJSONParse(raw);
          if (Array.isArray(arr)) setStudentsRaw(arr.map(s => s.email ? `${s.name}, ${s.email}` : s.name).join("\n"));
          setStatus("✅ Liste extraite.");
        } catch(e) { setStatus("⚠️ Échec de l'extraction auto."); }
        setBusy(false);
      };

      /* ── GÉNÉRATION DU CORRIGÉ DE RÉFÉRENCE ── */
      const generateMasterKey = async () => {
        if (!upSubPdf || !apiKey) return;
        setBusy(true); setStatus("Génération du corrigé officiel (Formatage Mathématique Optimal)...");
        try {
          const parts = [
            { inlineData: { mimeType: "application/pdf", data: upSubPdf } },
            { text: "Résous ce sujet de mathématiques de manière exhaustive. Dédaille chaque étape de calcul." }
          ];
          const sysInstruction = `Tu es un professeur de mathématiques. Rédige un corrigé parfait, structuré et détaillé.
RÈGLES DE FORMATAGE (CRITIQUE) :
- Structure avec \\section*{Exercice X} et \\subsection*{Question Y}.
- Isole TOUTES les équations sur leur propre ligne avec les balises $$...$$ (Display mode).
- Utilise $...$ pour les petites formules.
- N'utilise JAMAIS l'environnement \\begin{tabular}. Pour les tableaux (signes, variations) ou les arbres de probabilités, utilise EXCLUSIVEMENT l'environnement mathématique \\begin{array} et entoure-le toujours de $$...$$.`;
          
          const raw = await callGemini(apiKey, parts, sysInstruction, false, modelChoice, msg => setStatus(`[Génération Corrigé] ${msg}`));
          setMasterCorrection(raw);
          setStatus("✅ Corrigé de référence généré avec succès !");
        } catch(e) { setStatus("❌ Erreur : " + e.message); }
        setBusy(false);
      };

      /* ── CORRECTION GLOBALE 3 PHASES ── */
      const executeCorrection = async () => {
        if (!copiesPdfs.length || !apiKey || !students.length || !masterCorrection) return;
        setBusy(true); setStatus("Préparation du document global..."); setProgress(5);

        let mergedB64;
        try { mergedB64 = await mergePdfs(copiesPdfs); }
        catch(e) { setStatus("❌ Erreur fusion PDF : "+e.message); setBusy(false); return; }

        /* PHASE 1 : Cartographie globale */
        setStatus("Phase 1/3 : Repérage des copies dans le lot...");
        let pageMapping = [];
        try {
          const studentList = students.map(s => `- ${s.name}`).join("\n");
          const mappingPrompt = `Voici un document PDF scanné.
LISTE DES ÉLÈVES :
${studentList}
Identifie l'intervalle de pages de la copie de chaque élève. Retourne UN SEUL tableau JSON pur :
[ { "name": "Nom de l'élève", "pageStart": 1, "pageEnd": 2 } ]`;
          const rawMapping = await callGemini(apiKey, [{ inlineData: { mimeType: "application/pdf", data: mergedB64 } }, { text: mappingPrompt }], "JSON pur.", true, modelChoice, msg => setStatus(`[Cartographie] ${msg}`));
          pageMapping = safeJSONParse(rawMapping);
        } catch(e) { setStatus("❌ Échec cartographie : " + e.message); setBusy(false); return; }

        /* PHASE 2 & 3 : Découpage virtuel + Évaluation ciblée */
        setProgress(20);
        const { PDFDocument } = window.PDFLib;
        let srcDoc;
        try { srcDoc = await PDFDocument.load(Uint8Array.from(atob(mergedB64), c => c.charCodeAt(0))); }
        catch(e) { setStatus("❌ Erreur PDF-Lib : " + e.message); setBusy(false); return; }
        
        const totalPages = srcDoc.getPageCount();
        const results = [];

        for (let i = 0; i < students.length; i++) {
          const s = students[i];
          const mapData = pageMapping.find(m => m.name && m.name.toLowerCase().includes(s.name.split(" ")[0].toLowerCase()));
          
          if (!mapData || !mapData.pageStart) {
            results.push({...s, skipped: true, note: "?", appreciation: "Copie introuvable.", details: []});
            continue;
          }

          let subPdfB64 = null;
          try {
            const newDoc = await PDFDocument.create();
            const pStart = Math.max(0, mapData.pageStart - 1);
            const pEnd = Math.min(totalPages - 1, (mapData.pageEnd || mapData.pageStart) - 1);
            const indices = []; for (let p = pStart; p <= pEnd; p++) indices.push(p);
            if (indices.length > 0) {
              const copiedPages = await newDoc.copyPages(srcDoc, indices);
              copiedPages.forEach(pg => newDoc.addPage(pg));
              subPdfB64 = uint8ToBase64(await newDoc.save());
            }
          } catch(e) {}

          if (!subPdfB64) { results.push({...s, skipped: true, note: "?", appreciation: "Erreur découpage.", details: []}); continue; }

          setStatus(`Phase 3/3 : Correction ciblée de ${s.name} (${i + 1}/${students.length})…`);
          setProgress(20 + Math.round((i / students.length) * 80));

          if (i > 0) {
            let count = modelChoice.includes("pro") ? 30 : 3;
            while (count > 0) { setStatus(`Temporisation (${count}s) avant ${s.name}...`); await delay(1000); count--; }
          }

          const sysInstruction = `Tu es un correcteur intransigeant mais bienveillant. Tutoie l'élève. Utilise le corrigé de référence. Entoure TOUTES les équations avec $...$ dans les remarques. Pour les tableaux, utilise EXCLUSIVEMENT \\begin{array} entouré de $$.

RÈGLE ABSOLUE ET VITALE POUR LE FORMAT JSON :
Tu DOIS IMPÉRATIVEMENT doubler tous les antislashs des commandes mathématiques dans tes réponses JSON !
Exemple: Tu dois écrire \\\\frac au lieu de \\frac. Tu dois écrire \\\\times au lieu de \\times.
C'est obligatoire pour que le fichier ne soit pas corrompu.`;
          
          const promptText = `
CORRIGÉ OFFICIEL :
${masterCorrection}

DIRECTIVES ET BARÈME :
${userDirectives || "Applique un barème classique sur 20."}

TÂCHE : Voici la copie de ${s.name}. Évalue-la STRICTEMENT sur le corrigé et les directives.
SOIS EXTRÊMEMENT DÉTAILLÉ dans tes remarques pour CHAQUE sous-question (1.a, 1.b, etc.). Explique précisément où est l'erreur, calcule les points correspondants.
FORMAT JSON STRICT ATTENDU :
{
  "note": 14.5,
  "reviewNeeded": false,
  "appreciation": "${s.name.split(" ")[0]}, ton raisonnement est bon, mais attention...",
  "details": [ { "exercice": "Ex 1 - Q1.a", "sur": 2.0, "obtenu": 1.5, "remarque": "La factorisation est correcte jusqu'à l'avant-dernière ligne, mais tu as fait une erreur de signe : $2x-4=0 \\\\implies x=2$." } ],
  "conseil": "Relis tes formules de dérivation."
}`;

          try {
            const parts = [
              { inlineData: { mimeType: "application/pdf", data: subPdfB64 } },
              { text: promptText }
            ];
            const raw = await callGemini(apiKey, parts, sysInstruction, true, modelChoice, msg => setStatus(`[Correction ${s.name}] ${msg}`));
            const parsed = safeJSONParse(raw);
            results.push({...s, ...parsed, latexCorrection: masterCorrection});
          } catch(e) {
            results.push({...s, note:"?", appreciation:"Erreur IA : "+e.message, details:[], conseil:"", latexCorrection: masterCorrection});
          }
        }

        setProgress(100); setCorrections(results); setBusy(false);
        setStatus("✅ Évaluation par lot terminée !"); setTimeout(() => setStatus(""), 4000);
      };

      const sendResults = async () => {
        setBusy(true); setProgress(0);
        try { await getGmailToken(); } catch(e) { setStatus("❌ " + e.message); setBusy(false); return; }
        
        let errors = [];
        const activeStudents = corrections.filter(c => !c.skipped && c.email);
        
        for(let idx=0; idx<activeStudents.length; idx++){
          const c = activeStudents[idx];
          setStatus(`Envoi à ${c.name}…`); setProgress(Math.round((idx / activeStudents.length) * 100));
          
          const prenom = c.name.split(" ")[0];
          const appreciation = (c.appreciation||"").replace(/il\/elle/gi,"tu").replace(/l'élève/gi,"tu").replace(new RegExp(c.name,"gi"), prenom);
          const conseil = (c.conseil||"").replace(/il\/elle/gi,"tu").replace(/l'élève/gi,"tu").replace(new RegExp(c.name,"gi"), prenom);
          const body = `Bonjour ${prenom},\n\nVoici ton résultat pour le devoir de mathématiques "${sessionName}".\n\nTu trouveras en pièce jointe ton bilan personnalisé et le corrigé détaillé.\n\nCordialement,`;
          let pdfB64 = null;

          const hiddenDiv = document.createElement("div");
          hiddenDiv.style.position = "absolute"; 
          hiddenDiv.style.top = "-9999px"; 
          hiddenDiv.style.left = "-9999px"; 
          hiddenDiv.style.zIndex = "-1000";
          hiddenDiv.style.width = "800px";
          hiddenDiv.style.overflow = "hidden";
          hiddenDiv.style.background = "#ffffff"; 
          hiddenDiv.style.color = "#111827"; 
          hiddenDiv.style.fontFamily = "system-ui, sans-serif";
          
          try {
            const appendBlock = (htmlContent, padding="20px 40px") => {
              const block = document.createElement("div"); block.className = "pdf-block"; block.style.padding = padding;
              block.innerHTML = htmlContent; hiddenDiv.appendChild(block);
            };

            appendBlock(`
              <div style="border-bottom: 2px solid #e5e7eb; padding-bottom: 15px;">
                <h1 style="font-size:34px; margin:0 0 10px 0; color:#1e3a8a;">Bilan et Corrigé</h1>
                <h2 style="font-size:24px; margin:0 0 10px 0; color:#4b5563;">Élève : ${c.name}</h2>
                <h2 style="font-size:28px; margin:0; color:${!isNaN(+c.note) && +c.note >= 10 ? '#16a34a' : '#dc2626'};">Note : ${c.note}/20</h2>
              </div>
            `, "40px 40px 10px 40px");

            if (appreciation) appendBlock(`<div style="font-size:17px; line-height:1.6;"><strong>Appréciation :</strong><br/> ${latexToHtml(appreciation)}</div>`, "10px 40px");

            const detailsHtml = (c.details||[]).map(d => 
              `<div style="margin-bottom: 12px; padding: 14px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                  <b style="color: #1d4ed8; font-size: 18px;">${d.exercice}</b>
                  <span style="font-weight: 700; font-size: 18px;">${d.obtenu}/${d.sur}</span>
                </div>
                ${d.remarque ? `<div style="color: #374151; border-top:1px dashed #d1d5db; padding-top:8px;">${latexToHtml(d.remarque)}</div>` : ''}
              </div>`
            ).join("");

            appendBlock(`<div style="background: #f9fafb; padding: 20px; border-radius: 8px;"><h3 style="margin-top:0; font-size:20px;">Détail par exercice</h3>${detailsHtml}</div>`, "15px 40px");
            if (conseil) appendBlock(`<div style="font-size:17px; line-height:1.6; padding: 16px; background: #eff6ff; border-left: 4px solid #3b82f6;"><strong>Conseil :</strong><br/> ${latexToHtml(conseil)}</div>`, "10px 40px");
            
            appendBlock(`<div style="border-top: 2px solid #e5e7eb; padding-top: 20px;"><h3 style="margin-top:0; font-size:24px; color:#1e3a8a;">Corrigé détaillé de l'épreuve</h3></div>`, "20px 40px 10px 40px");

            const tempCorr = document.createElement("div");
            tempCorr.innerHTML = c.latexCorrection ? latexToHtml(c.latexCorrection) : '<p>Aucun corrigé.</p>';
            
            Array.from(tempCorr.childNodes).forEach(node => {
              if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) return;
              const block = document.createElement("div"); block.className = "pdf-block"; block.style.padding = "4px 40px";
              if (node.nodeType === Node.TEXT_NODE) block.textContent = node.textContent; else block.appendChild(node.cloneNode(true));
              hiddenDiv.appendChild(block);
            });
            
            document.body.appendChild(hiddenDiv);
            await new Promise(r => setTimeout(r, 400));

            const {jsPDF} = window.jspdf;
            const pdf = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
            const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), m = 15, iw = W - m*2;
            let currentY = m;
            
            const blocks = Array.from(hiddenDiv.querySelectorAll('.pdf-block'));
            for (let i = 0; i < blocks.length; i++) {
              const b = blocks[i];
              if (!b.innerText.trim() && !b.querySelector('.katex')) continue;
              
              const canvas = await window.html2canvas(b, {scale: 2.5, useCORS: true, backgroundColor: "#ffffff"}); 
              const imgH = (canvas.height * iw) / canvas.width;
              
              if (currentY + imgH > H - m && currentY > m + 10) { pdf.addPage(); currentY = m; }
              
              if (imgH > H - 2*m) {
                let remaining = imgH, srcY = 0; const ratio = canvas.width / iw;
                while(remaining > 0) {
                  const sliceH = Math.min(remaining, H - currentY - m);
                  const sc = document.createElement("canvas"); sc.width = canvas.width; sc.height = sliceH * ratio;
                  sc.getContext("2d").drawImage(canvas, 0, srcY, canvas.width, sliceH * ratio, 0, 0, sc.width, sc.height);
                  pdf.addImage(sc.toDataURL("image/jpeg", 0.98), "JPEG", m, currentY, iw, sliceH, undefined, 'FAST');
                  remaining -= sliceH; srcY += sliceH * ratio; currentY += sliceH;
                  if (remaining > 0) { pdf.addPage(); currentY = m; }
                }
              } else {
                pdf.addImage(canvas.toDataURL("image/jpeg", 0.98), "JPEG", m, currentY, iw, imgH, undefined, 'FAST');
                currentY += imgH;
              }
            }
            pdfB64 = uint8ToBase64(new Uint8Array(pdf.output("arraybuffer")));
          } catch(e) { 
            console.error("Erreur PDF :", e); 
          } finally {
            if (document.body.contains(hiddenDiv)) document.body.removeChild(hiddenDiv);
          }
          
          try { 
            if (pdfB64) await sendGmail(c.email, sessionName, body, pdfB64, `Bilan_Maths_${prenom}.pdf`); 
            else throw new Error("PDF null");
          } catch(e) { errors.push(c.name); }
        }
        setProgress(100); setMailsDone(true); setBusy(false);
        setStatus(errors.length ? `⚠️ Échec envois : ${errors.join(", ")}` : "✅ Mails envoyés !");
      };

      return (
        <div style={{ maxWidth:750, margin:"0 auto", padding:"1.5rem 1rem" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"1.5rem" }}>
            <div>
              <h1 style={{ fontSize:20, marginBottom:4, color:"#111827" }}>{sessionName}</h1>
              <button style={{ background:"transparent", color:"#6b7280", border:"none", padding:0, fontSize:13 }} onClick={onBack}>← Retour aux devoirs</button>
            </div>
            <div style={{ fontSize:12, color:"#16a34a", background:"#dcfce7", padding:"4px 10px", borderRadius:12 }}>Sauvegarde auto activée</div>
          </div>

          <Card>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <Field label="🔑 Clé API Google AI Studio">
                <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="AIzaSy..." style={{ fontFamily:"monospace" }}/>
              </Field>
              <Field label="🤖 Modèle IA">
                <select value={modelChoice} onChange={e => setModelChoice(e.target.value)}>
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash (Super équilibre)</option>
                  <option value="gemini-1.5-flash">Gemini 1.5 Flash (Ultra Rapide)</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro (Lent - Très Analytique)</option>
                </select>
              </Field>
            </div>
          </Card>

          <div style={{ display:"flex", alignItems:"flex-start", marginBottom:"2rem", background:"#fff", padding:"20px", borderRadius:12, border:"1px solid #e5e7eb" }}>
            {STEPS.map((label,i)=>{
              const done=i<step,active=i===step;
              return (
                <div key={i} style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:8 }}>
                  <div style={{ display:"flex",alignItems:"center",width:"100%" }}>
                    {i>0&&<div style={{ flex:1,height:"2px",background:i<=step?"#1d4ed8":"#e5e7eb" }}/>}
                    <div onClick={()=>done&&setStep(i)} style={{
                      width:36,height:36,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:14,fontWeight:600,flexShrink:0,cursor:done?"pointer":"default",
                      background:done?"#1d4ed8":active?"#dbeafe":"#f3f4f6",
                      color:done?"#fff":active?"#1d4ed8":"#9ca3af",
                      border:done?"none":active?"2px solid #1d4ed8":"2px solid #e5e7eb",
                    }}>{done?"✓":i+1}</div>
                    {i<STEPS.length-1&&<div style={{ flex:1,height:"2px",background:i<step?"#1d4ed8":"#e5e7eb" }}/>}
                  </div>
                  <span style={{ fontSize:12,textAlign:"center",color:active?"#1d4ed8":"#6b7280",fontWeight:active?700:500 }}>{label}</span>
                </div>
              );
            })}
          </div>

          {(busy || status) && (
            <div style={{ background: status.includes("❌")||status.includes("⚠️")?"#fee2e2":"#eff6ff", border: status.includes("❌")||status.includes("⚠️")?"1px solid #fca5a5":"1px solid #bfdbfe", borderRadius:8, padding:"16px", marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:14, fontWeight:600, color: status.includes("❌")||status.includes("⚠️")?"#dc2626":"#1d4ed8", marginBottom:busy?8:0 }}>
                <span>{status}</span>
                {busy && <span>{progress}%</span>}
              </div>
              {busy && <div style={{ width:"100%", background:"#dbeafe", height:6, borderRadius:3, overflow:"hidden" }}><div style={{ width:`${progress}%`, background:"#1d4ed8", height:"100%", transition:"width 0.3s" }}/></div>}
            </div>
          )}

          {step===0&&(
            <Card>
              <SectionHead title="Le Sujet de l'Évaluation"/>
              <p style={{ fontSize:14, color:"#6b7280", marginBottom:16 }}>Déposez le fichier PDF du sujet. Il servira de base à l'IA pour générer le corrigé parfait à l'étape suivante.</p>
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleSubjectPdf(e.dataTransfer.files[0]);}} onClick={()=>document.getElementById("subj-pdf").click()}
                style={{ border:"2px dashed #cbd5e1", borderRadius:12, padding:"3rem 2rem", textAlign:"center", cursor:"pointer", background:upSubPdf?"#f0fdf4":"#f8fafc", transition:"all 0.2s" }}>
                <input id="subj-pdf" type="file" accept="application/pdf" style={{ display:"none" }} onChange={e=>handleSubjectPdf(e.target.files[0])}/>
                {upSubPdf?<div style={{ color:"#16a34a", fontSize:16, fontWeight:600 }}>✓ Sujet chargé : {upSubPdfName}</div>:
                <div style={{ color:"#64748b", fontSize:15 }}>📄 Cliquez ou glissez le PDF du Sujet ici</div>}
              </div>
            </Card>
          )}

          {step===1&&(
            <Card>
              <SectionHead title="Les Copies des Élèves"/>
              <p style={{ fontSize:14, color:"#6b7280", marginBottom:16 }}>Déposez le PDF scanné de toute la classe. Le système extraira automatiquement les noms.</p>
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();addCopiesPdf(e.dataTransfer.files);}} onClick={()=>document.getElementById("copies-pdf").click()}
                style={{ border:"2px dashed #cbd5e1", borderRadius:12, padding:"2rem", textAlign:"center", cursor:"pointer", marginBottom:16, background:copiesPdfs.length?"#f0fdf4":"#f8fafc" }}>
                <input id="copies-pdf" type="file" accept="application/pdf" multiple style={{ display:"none" }} onChange={e=>{if(e.target.files.length)addCopiesPdf(e.target.files);}}/>
                {copiesPdfs.length>0?<div style={{ color:"#16a34a", fontWeight:600 }}>✓ {copiesPdfs.length} fichier(s) PDF en mémoire</div>:
                <div style={{ color:"#64748b" }}>📥 Déposez le PDF des copies scannées</div>}
              </div>
              <Field label="Liste des élèves reconnus (Ajustez les emails si besoin) :">
                <textarea value={studentsRaw} onChange={e=>setStudentsRaw(e.target.value)} placeholder="Nom, email@lycee.fr..." style={{ minHeight:150, fontFamily:"monospace", fontSize:13 }}/>
              </Field>
            </Card>
          )}

          {step===2&&(
            <Card>
              <SectionHead title="Le Corrigé de Référence (Pilotage de l'IA)"/>
              <div style={{ background:"#fffbeb", border:"1px solid #fde68a", padding:"12px 16px", borderRadius:8, fontSize:13, color:"#b45309", marginBottom:16 }}>
                💡 En générant un corrigé de référence une seule fois, vous garantissez l'homogénéité de la notation pour toute la classe et vous divisez par 5 votre consommation de tokens !
              </div>

              {!masterCorrection ? (
                <button disabled={busy||!apiKey||!upSubPdf} onClick={generateMasterKey} style={{ width:"100%", background:"#4f46e5", padding:"14px", fontSize:15 }}>✨ Générer le corrigé officiel depuis le sujet</button>
              ) : (
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                  <div style={{ border:"1px solid #e5e7eb", borderRadius:8, background:"#f9fafb" }}>
                    <div style={{ padding:"10px 14px", background:"#e5e7eb", fontWeight:600, fontSize:13, borderTopLeftRadius:8, borderTopRightRadius:8, display:"flex", justifyContent:"space-between" }}>
                      Aperçu du corrigé généré par l'IA
                      <button onClick={generateMasterKey} style={{ background:"transparent", border:"none", color:"#4f46e5", padding:0, fontSize:12 }}>Regénérer 🔄</button>
                    </div>
                    <div style={{ padding:"16px", maxHeight:"400px", overflowY:"auto", fontSize:14 }} dangerouslySetInnerHTML={{ __html: latexToHtml(masterCorrection) }} />
                  </div>
                  <Field label="Vos consignes d'adaptation & Barème (L'IA obéira à ces règles pour la correction) :">
                    <textarea value={userDirectives} onChange={e=>setUserDirectives(e.target.value)} 
                      placeholder="Ex: L'exercice 1 est sur 5 points. Ne pénalise pas si l'élève oublie la constante d'intégration à la question 2. Sois indulgent sur les erreurs de calcul..." 
                      style={{ minHeight:100, border:"2px solid #bfdbfe", background:"#eff6ff" }}/>
                  </Field>
                </div>
              )}
            </Card>
          )}

          {step===3&&(
            <Card>
              <SectionHead title="Évaluation Intelligente"/>
              {corrections.length===0 ? (
                <div style={{ textAlign:"center", padding:"2rem 0" }}>
                  <p style={{ fontSize:15, color:"#374151", marginBottom:24 }}>
                    L'IA va maintenant extraire chaque copie du grand PDF et l'évaluer en appliquant strictement votre corrigé de référence.
                  </p>
                  <button disabled={busy||!apiKey||students.length===0} onClick={executeCorrection} style={{ background:"#16a34a", padding:"16px 32px", fontSize:16, fontWeight:600 }}>
                    🚀 Lancer l'évaluation de la classe ({students.length} élèves)
                  </button>
                </div>
              ) : (
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                  <div style={{ background:"#dcfce7", color:"#166534", padding:"12px", borderRadius:8, fontSize:14, fontWeight:500 }}>
                    ✅ Corrections terminées. Vous pouvez ajuster les notes et mots de passe ci-dessous.
                  </div>
                  {students.map(s=>{
                    const c=corrections.find(x=>x.id===s.id);
                    if (!c||c.skipped) return <div key={s.id} style={{ padding:12, background:"#f3f4f6", color:"#6b7280", borderRadius:8, fontSize:13 }}>Copie de {s.name} ignorée/introuvable.</div>;
                    return (
                      <div key={s.id} style={{ border:"1px solid #e5e7eb", borderRadius:10, padding:16 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                          <span style={{ fontWeight:600, fontSize:16 }}>{s.name}</span>
                          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                            <input type="text" value={c.note??""} onChange={e=>updateCorrection(s.id,'note',e.target.value)} style={{ width:60, textAlign:"center", fontWeight:"bold", fontSize:16, border:"2px solid #d1d5db" }}/>
                            <span style={{ color:"#6b7280", fontWeight:600 }}>/20</span>
                          </div>
                        </div>
                        <Field label="Appréciation">
                          <textarea value={c.appreciation||""} onChange={e=>updateCorrection(s.id,'appreciation',e.target.value)} style={{ minHeight:60 }}/>
                        </Field>
                        <div style={{ display:"grid", gap:8, background:"#f9fafb", padding:12, borderRadius:8, marginBottom:12 }}>
                          {c.details?.map((d,i)=>(
                            <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                              <b>{d.exercice}</b>
                              <span dangerouslySetInnerHTML={{__html: `<b>${d.obtenu}/${d.sur}</b> — ` + latexToHtml(d.remarque).replace(/<p[^>]*>/g,'').replace(/<\/p>/g,'')}}/>
                            </div>
                          ))}
                        </div>
                        <Field label="Conseil">
                          <textarea value={c.conseil||""} onChange={e=>updateCorrection(s.id,'conseil',e.target.value)} style={{ minHeight:40 }}/>
                        </Field>
                      </div>
                    );
                  })}
                  <button onClick={()=>setCorrections([])} style={{ background:"#f1f5f9", color:"#475569" }}>↻ Réinitialiser les corrections</button>
                </div>
              )}
            </Card>
          )}

          {step===4&&(
            <Card>
              <SectionHead title="Diffusion des Résultats"/>
              <div style={{ display:"flex", gap:12, marginBottom:20 }}>
                <button onClick={()=>{
                  const rows = [...validCorrs]
                    .sort((a, b) => {
                      const getLastName = name => {
                        const parts = name.trim().split(/\s+/);
                        return parts.length > 1 ? parts.pop().toLowerCase() : name.toLowerCase();
                      };
                      return getLastName(a.name).localeCompare(getLastName(b.name), 'fr');
                    })
                    .map(c => `"${c.name}","${c.note}","${(c.appreciation||"").replace(/"/g,"'")}","${(c.conseil||"").replace(/"/g,"'")}"`);
                  const a = document.createElement("a"); a.href = "data:text/csv;charset=utf-8," + encodeURIComponent("\uFEFF\"Nom\",\"Note\",\"Appreciation\",\"Conseil\"\n" + rows.join("\n"));
                  a.download = `Notes_${sessionName.replace(/\W/g,"_")}.csv`; a.click();
                }} style={{ flex:1, background:"#f8fafc", color:"#0f172a", border:"1px solid #cbd5e1" }}>📊 Exporter Tableur (CSV)</button>
              </div>

              <div style={{ background:"#f8fafc", padding:20, borderRadius:12, textAlign:"center", border:"1px solid #e2e8f0" }}>
                <div style={{ fontSize:14, color:"#64748b", marginBottom:8 }}>Moyenne de la classe</div>
                <div style={{ fontSize:36, fontWeight:700, color:"#0f172a" }}>{validCorrs.length>0?avg.toFixed(1):"—"}<span style={{ fontSize:20, color:"#94a3b8" }}>/20</span></div>
              </div>

              <div style={{ marginTop:24 }}>
                {mailsDone ? (
                  <div style={{ textAlign:"center", padding:24, background:"#f0fdf4", border:"1px solid #86efac", borderRadius:12, color:"#166534" }}>
                    <div style={{ fontSize:40, marginBottom:12 }}>🚀</div>
                    <div style={{ fontSize:18, fontWeight:600 }}>Tous les PDF personnalisés ont été envoyés !</div>
                  </div>
                ) : (
                  <button disabled={busy} onClick={sendResults} style={{ width:"100%", padding:"16px", background:"#2563eb", fontSize:16, fontWeight:600 }}>
                    {busy ? "Génération des PDF et envois..." : "📧 Créer les PDF HD et Envoyer par Gmail"}
                  </button>
                )}
              </div>
            </Card>
          )}

          <div style={{ display:"flex", justifyContent:"space-between", marginTop:"2rem" }}>
            <button style={{ background:"transparent", color:"#475569", border:"1px solid #cbd5e1", visibility:step>0?"visible":"hidden" }} disabled={busy} onClick={()=>setStep(step-1)}>← Étape Précédente</button>
            {step<4&&<button disabled={!canNext||busy||!apiKey} onClick={()=>setStep(step+1)} style={{ background:"#0f172a", padding:"8px 24px" }}>Continuer →</button>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
