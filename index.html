<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devoirs Maths - V3 (Correct)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-blue-900">📐 Gestionnaire de Devoirs (V3)</h1>
    
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <label class="block text-sm font-semibold text-gray-700 mb-2">🔑 Clé API</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full px-4 py-2 border border-gray-300 rounded-lg">
    </div>

    <div id="mainContainer" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold mb-4">Charger les copies (PDF)</h2>
      <input type="file" id="copiesInput" accept="application/pdf" class="w-full p-4 border-2 border-dashed border-gray-300 rounded-lg">
      <p id="status" class="mt-4 text-blue-600 font-bold hidden">🤖 Extraction en cours...</p>
      <ul id="results" class="mt-6 space-y-2"></ul>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const copiesInput = document.getElementById('copiesInput');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    copiesInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      status.classList.remove('hidden');
      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Data = event.target.result.split(',')[1];
        
        // UTILISATION DU MODÈLE VALIDÉ DANS TA LISTE
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKeyInput.value}`;
        
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inlineData: { mimeType: "application/pdf", data: base64Data } },
                  { text: "Identifie les élèves. Retourne uniquement un JSON pur de type: [{\"name\": \"Nom Prénom\", \"email\": \"\"}]" }
                ]
              }]
            })
          });

          const data = await response.json();
          const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '');
          const students = JSON.parse(rawText);
          
          results.innerHTML = students.map(s => `<li class="p-3 bg-blue-50 rounded">${s.name} - ${s.email || 'Pas d\'email'}</li>`).join('');
        } catch (err) {
          alert("Erreur : " + err.message);
        } finally {
          status.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
