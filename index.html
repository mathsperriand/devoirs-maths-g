  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GMAIL_CLIENT_ID = "12140416952-p35g87hffvftb9jbtksj4nsc5r870i7h.apps.googleusercontent.com";
    const GMAIL_SENDER = "maths.perriand@gmail.com";

    let gmailToken = "";

    function getGmailToken() {
      return new Promise((resolve, reject) => {
        if (gmailToken) return resolve(gmailToken);
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: GMAIL_CLIENT_ID,
            scope: "https://www.googleapis.com/auth/gmail.send",
            callback: (response) => {
              if (response.error) return reject(response.error);
              gmailToken = response.access_token;
              resolve(gmailToken);
            },
          });
          client.requestAccessToken({ prompt: 'consent' });
        } catch (e) { reject(e); }
      });
    }

    function encodeBase64UTF8(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function wrapBase64(b64Str) {
      const chunks = [];
      for (let i = 0; i < b64Str.length; i += 76) {
        chunks.push(b64Str.substring(i, i + 76));
      }
      return chunks.join("\r\n");
    }

    function b64urlMime(asciiStr) {
      const bytes = new TextEncoder().encode(asciiStr);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function buildMime(to, subject, body) {
      const msg = [
        `From: ${GMAIL_SENDER}`,
        `To: ${to}`,
        `Subject: =?UTF-8?B?${encodeBase64UTF8(subject)}?=`,
        "MIME-Version: 1.0",
        "Content-Type: text/plain; charset=utf-8",
        "Content-Transfer-Encoding: base64",
        "",
        wrapBase64(encodeBase64UTF8(body))
      ].join("\r\n");
      return b64urlMime(msg);
    }

    function buildMimeWithPdf(to, subject, body, pdfB64, pdfFilename) {
      const boundary = "foo_bar_baz_boundary_" + Math.random().toString(36).slice(2);
      const msg = [
        `From: ${GMAIL_SENDER}`,
        `To: ${to}`,
        `Subject: =?UTF-8?B?${encodeBase64UTF8(subject)}?=`,
        "MIME-Version: 1.0",
        `Content-Type: multipart/mixed; boundary="${boundary}"`,
        "",
        `--${boundary}`,
        "Content-Type: text/plain; charset=utf-8",
        "Content-Transfer-Encoding: base64",
        "",
        wrapBase64(encodeBase64UTF8(body)),
        "",
        `--${boundary}`,
        `Content-Type: application/pdf; name="${pdfFilename}"`,
        "Content-Transfer-Encoding: base64",
        `Content-Disposition: attachment; filename="${pdfFilename}"`,
        "",
        wrapBase64(pdfB64),
        "",
        `--${boundary}--`
      ].join("\r\n");
      return b64urlMime(msg);
    }

    async function sendGmail(to, subject, body, pdfB64 = null, pdfFilename = null) {
      const token = await getGmailToken();
      const raw = pdfB64 ? buildMimeWithPdf(to, subject, body, pdfB64, pdfFilename) : buildMime(to, subject, body);
      const res = await fetch("https://gmail.googleapis.com/v1/users/me/messages/send", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ raw })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Erreur API Gmail: ${res.status} - ${errText}`);
      }
      return await res.json();
    }

    async function callGemini(apiKey, parts, systemInstruction = "", jsonMode = false) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${apiKey}`;
      const payload = { contents: [{ parts }] };
      if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      if (jsonMode) payload.generationConfig = { responseMimeType: "application/json" };
      
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Gemini API Error: ${res.status} - ${txt}`);
      }
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    function latexToHtml(tex) {
      if (!tex) return "";
      let html = tex;
      html = html.replace(/\$\$([\s\S]+?)\$\$/g, (m, g) => {
        try { return `<div style="margin:1em 0;text-align:center;">${katex.renderToString(g, {displayMode:true,throwOnError:false})}</div>`; }
        catch(e){ return `<pre>${g}</pre>`; }
      });
      html = html.replace(/\$([\s\S]+?)\$/g, (m, g) => {
        try { return katex.renderToString(g, {displayMode:false,throwOnError:false}); }
        catch(e){ return `<code>${g}</code>`; }
      });
      return html.replace(/\n/g, "<br/>");
    }

    function uint8ToBase64(uint8Array) {
      let binary = "";
      const len = uint8Array.byteLength;
      for (let i = 0; i < len; i++) { binary += String.fromCharCode(uint8Array[i]); }
      return btoa(binary);
    }

    function Card({ children }) { return <div class="card">{children}</div>; }

    function App() {
      const [step, setStep] = useState(0);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_apikey") || "");
      const [sessionName, setSessionName] = useState("");
      const [latexSrc, setLatexSrc] = useState("");
      const [studentsText, setStudentsText] = useState("");
      const [pdfFiles, setPdfFiles] = useState([]);
      const [libsOk, setLibsOk] = useState({ jspdf: false, pdflib: false, html2canvas: false });
      const [status, setStatus] = useState("");
      const [busy, setBusy] = useState(false);
      const [corrections, setCorrections] = useState([]);
      const [mailsDone, setMailsDone] = useState(false);

      useEffect(() => {
        localStorage.setItem("gemini_apikey", apiKey);
      }, [apiKey]);

      useEffect(() => {
        setLibsOk({
          jspdf: !!window.jspdf,
          pdflib: !!window.PDFLib,
          html2canvas: !!window.html2canvas
        });
      }, []);

      const handlePdfDrop = (e) => {
        e.preventDefault();
        if (e.dataTransfer.files) {
          const files = Array.from(e.dataTransfer.files).filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
          setPdfFiles(prev => [...prev, ...files]);
        }
      };

      const removePdf = (idx) => { setPdfFiles(prev => prev.filter((_, i) => i !== idx)); };

      const parseStudentsList = () => {
        if (!studentsText.trim()) return [];
        return studentsText.split("\n").map(l => {
          const t = l.trim(); if (!t) return null;
          const parts = t.split(/\s+/);
          if (parts.length < 2) return { name: t, email: "" };
          const last = parts[parts.length - 1];
          if (last.includes("@") && last.includes(".")) {
            return { name: parts.slice(0, -1).join(" "), email: last };
          }
          return { name: t, email: "" };
        }).filter(Boolean);
      };

      const studentsParsed = parseStudentsList();
      const canNext = step === 0 ? (sessionName.trim() && studentsParsed.length > 0) : true;

      const runCorrection = async () => {
        setBusy(true); setStatus("Initialisation de la correction...");
        try {
          let mergedPdfBytes = null;
          if (pdfFiles.length > 0) {
            setStatus("Fusion des documents PDF d'entrée...");
            const { PDFDocument } = window.PDFLib;
            const outDoc = await PDFDocument.create();
            for (const f of pdfFiles) {
              const ab = await f.arrayBuffer();
              const inDoc = await PDFDocument.load(ab);
              const pages = await outDoc.copyPages(inDoc, inDoc.getPageIndices());
              pages.forEach(p => outDoc.addPage(p));
            }
            mergedPdfBytes = await outDoc.save();
          }

          let pdfTextExtract = "";
          if (mergedPdfBytes) {
            pdfTextExtract = "[Fichier PDF joint contenant les scans de copies]";
          }

          const promptParts = [{ text: `Tu es un assistant professeur de mathématiques. Analyse le barème, le sujet ou le contexte s'ils sont fournis.
Voici la liste des élèves attendus :\n${studentsParsed.map(s => s.name).join("\n")}

CONTEXTE / SUJET / BAREME RECHERCHÉ (optionnel) :
${latexSrc}

DONNÉES DES COPIES OU NOTES TEXTUELLES :
${pdfTextExtract}

Génère une réponse JSON stricte représentant un tableau d'objets, un par élève trouvé ou identifié. Format attendu :
\`\`\`json
[
  {
    "name": "Nom de l'élève exact",
    "note": "Note sur 20 (ex: 14.5, 08, 12)",
    "appreciation": "Appréciation globale constructive et bienveillante.",
    "conseil": "Conseil précis pour progresser à l'avenir.",
    "details": [
      { "exercice": "Exercice 1", "obtenu": "3", "sur": "5", "remarque": "Erreur de calcul sur le discriminant." }
    ]
  }
]
\`\`\`
Remplis la structure au mieux selon les données textuelles ou PDF fournies.` }];

          setStatus("Analyse globale par l'IA (Gemini)...");
          const resText = await callGemini(apiKey, promptParts, "Tu es un outil d'extraction et d'évaluation de devoirs de mathématiques. Renvoie UNIQUEMENT du JSON valide.", true);
          
          let parsed = [];
          try {
            const clean = resText.replace(/^```json\n/gi, "").replace(/\n```$/g, "").trim();
            parsed = JSON.parse(clean);
          } catch(e) {
            console.error("Erreur de parsing JSON brut Gemini, tentative de correction...", e);
            parsed = [];
          }

          const finalRows = studentsParsed.map((st, idx) => {
            const match = parsed.find(p => p && p.name && p.name.toLowerCase().includes(st.name.toLowerCase()) || st.name.toLowerCase().includes(p.name?.toLowerCase()));
            return {
              id: idx,
              name: st.name,
              email: st.email,
              note: match ? match.note : "",
              appreciation: match ? match.appreciation : "",
              conseil: match ? match.conseil : "",
              details: match ? match.details : [{ exercice: "Général", obtenu: "", sur: "20", remarque: "" }],
              skipped: false
            };
          });

          setCorrections(finalRows);
          setStep(2);
          setStatus("");
        } catch(e) {
          console.error(e); setStatus("❌ Erreur : " + (e.message || e));
        } finally { setBusy(false); }
      };

      const updateCorrectionField = (id, field, val) => {
        setCorrections(prev => prev.map(c => c.id === id ? { ...c, [field]: val } : c));
      };

      const updateDetailField = (id, detailIdx, field, val) => {
        setCorrections(prev => prev.map(c => {
          if (c.id !== id) return c;
          const nd = [...c.details];
          nd[detailIdx] = { ...nd[detailIdx], [field]: val };
          return { ...c, details: nd };
        }));
      };

      const addDetailRow = (id) => {
        setCorrections(prev => prev.map(c => c.id === id ? { ...c, details: [...c.details, { exercice: `Ex ${c.details.length+1}`, obtenu: "", sur: "", remarque: "" }] } : c));
      };

      const removeDetailRow = (id, detailIdx) => {
        setCorrections(prev => prev.map(c => c.id === id ? { ...c, details: c.details.filter((_, i) => i !== detailIdx) } : c));
      };

      const exportCsv = () => {
        const valid = corrections.filter(c => !c.skipped);
        let csv = "Élève;Email;Note;Appréciation;Conseil\n";
        valid.forEach(c => {
          csv += `"${c.name}";"${c.email}";"${c.note}";"${(c.appreciation||"").replace(/"/g,'""')}";"${(c.conseil||"").replace(/"/g,'""')}"\n`;
        });
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = `notes_${sessionName.replace(/\s+/g, '_')}.csv`;
        a.click();
      };

      const exportPdfRecap = () => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        pdf.setFontSize(16); pdf.text(`Récapitulatif des résultats : ${sessionName}`, 14, 20);
        pdf.setFontSize(10); pdf.text(`Généré le ${new Date().toLocaleDateString('fr-FR')}`, 14, 26);
        
        let y = 35;
        pdf.setFontSize(11);
        pdf.setFillColor(243, 244, 246); pdf.rect(14, y, 182, 7, "F");
        pdf.text("Élève", 16, y + 5); pdf.text("Note / 20", 120, y + 5); pdf.text("Statut Email", 150, y + 5);
        y += 10;

        corrections.forEach(c => {
          if (y > 270) { pdf.addPage(); y = 20; }
          pdf.text(c.name, 16, y);
          pdf.text(c.skipped ? "Sauté" : (c.note || "—"), 120, y);
          pdf.text(c.skipped ? "—" : (c.email ? c.email : "Pas d'adresse"), 150, y);
          y += 7;
        });

        pdf.save(`recap_${sessionName.replace(/\s+/g, '_')}.pdf`);
      };

      async function sendResults() {
        setBusy(true);
        try {
          setStatus("Connexion Gmail — choisissez votre compte…");
          await getGmailToken();
        } catch(e) {
          setStatus("❌ " + (e.message || e) + " — Réessayez.");
          setBusy(false); return;
        }

        let errors = [];
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        for (const c of corrections) {
          if (c.skipped) continue;
          
          setStatus(`Vérification des informations pour ${c.name}…`);
          if (!c.email || !c.email.trim()) {
            errors.push(`${c.name} (Adresse e-mail manquante)`);
            continue;
          }
          if (!emailRegex.test(c.email.trim())) {
            errors.push(`${c.name} (Format d'e-mail invalide : "${c.email}")`);
            continue;
          }

          setStatus(`Envoi à ${c.name}…`);
          const prenom = c.name.split(" ")[0];
          
          let appreciation = c.appreciation || "";
          appreciation = appreciation.replace(/il\/elle/gi,"tu").replace(/l'élève/gi,"tu");
          if (c.name) appreciation = appreciation.split(c.name).join(prenom);
          
          let conseil = c.conseil || "";
          conseil = conseil.replace(/il\/elle/gi,"tu").replace(/l'élève/gi,"tu");
          if (c.name) conseil = conseil.split(c.name).join(prenom);
          
          const body = `Bonjour ${prenom},\n\nVoici ton résultat pour ce devoir de mathématiques.\n\nNOTE : ${c.note}/20\n\nTu trouveras en pièce jointe ton rapport complet avec le corrigé officiel rédigé proprement en notation mathématique.\n\nCordialement,\nF. Nocca`;
          const subject = `Résultats – ${sessionName}`;
          let pdfB64 = null, pdfFilename = null;
          
          let tempDiv = null;

          try {
            setStatus(`Génération du corrigé LaTeX pour ${prenom}…`);
            const parts = [{ text: "Rédige le corrigé mathématique strictement technique pour " + prenom + " (note : " + c.note + "/20).\n" +
              "SUJET :\n" + (latexSrc||"[sujet fourni en PDF]") + "\n\n" +
              "DÉTAIL ET REMARQUES :\n" + (c.details||[]).map(d=>d.exercice+" : "+d.remarque).join("\n") + "\n\n" +
              "Consignes obligatoires :\n" +
              "- Fais des réponses mathématiques directes et complètes.\n" +
              "- Ne remets AUCUNE appréciation globale ni phrase de politesse d'introduction ou de conclusion.\n" +
              "- Utilise la syntaxe LaTeX standard ($...$ et $$...$$) pour TOUTES les mathématiques.\n" +
              "- NE METS PAS la réponse dans un bloc markdown (pas de ```latex ni de ```). Commence directement ton texte." }];
            
            let corrTexte = await callGemini(apiKey, parts, "Tu es un professeur de mathématiques. Ne génère que du texte brut avec formules LaTeX, jamais de Markdown.", false);
            corrTexte = corrTexte.replace(/^```[a-z]*\n/gi, "").replace(/\n```$/g, "").trim();

            setStatus(`Création de la pièce jointe pour ${prenom}…`);
            
            tempDiv = document.createElement("div");
            tempDiv.style.width = "750px";
            tempDiv.style.background = "#ffffff";
            tempDiv.style.padding = "40px";
            tempDiv.style.color = "#111827";
            tempDiv.style.fontFamily = "system-ui, -apple-system, sans-serif";
            tempDiv.style.lineHeight = "1.6";
            tempDiv.style.fontSize = "14px";
            
            tempDiv.style.position = "absolute";
            tempDiv.style.left = "0px";
            tempDiv.style.top = "0px";
            tempDiv.style.zIndex = "-9999";
            tempDiv.style.opacity = "0";
            tempDiv.style.pointerEvents = "none";
            
            document.body.appendChild(tempDiv);

            const detailsHtml = (c.details || []).map(d => `
              <div style="display:flex; justify-content:space-between; padding:6px 0; border-top:0.5px solid #e5e7eb; font-size:13px;">
                <span style="color:#4b5563; font-weight:500;">${d.exercice}</span>
                <span><strong>${d.obtenu}/${d.sur}</strong> — ${d.remarque}</span>
              </div>
            `).join("");

            const noteColor = !isNaN(+c.note) && +c.note >= 10 ? '#16a34a' : '#dc2626';

            tempDiv.innerHTML = `

                </div>
                <div style="text-align: center; background: #ffffff; padding: 12px 18px; border-radius: 8px; border: 1px solid #e5e7eb; min-width: 100px; flex-shrink:0;">
                  <div style="font-size: 10px; text-transform: uppercase; color: #9ca3af; font-weight: 700; margin-bottom:2px; letter-spacing:0.5px;">Note Globale</div>
                  <div style="font-size: 26px; font-weight: 800; color: ${noteColor}">${c.note}<span style="font-size:14px; color:#9ca3af; font-weight:400;">/20</span></div>
                </div>
              </div>

              <div style="margin-bottom: 25px;">
                <h3 style="font-size: 13px; font-weight: 700; text-transform: uppercase; color: #4b5563; margin-bottom: 10px; letter-spacing:0.5px;">Détails par exercice</h3>
                ${detailsHtml}
              </div>

              <div style="margin-bottom: 30px; background: #f0fdf4; padding: 14px 16px; border-radius: 8px; border: 0.5px solid #bbf7d0; color: #166534;">
                <strong style="font-size:13px;">💡 Conseil de progression :</strong>
                <p style="margin-top: 4px; font-size: 13.5px; color: #14532d;">${conseil}</p>
              </div>

              <div style="margin-top: 35px; border-top: 1px dashed #d1d5db; padding-top: 25px;">
                <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #111827; border-left: 4px solid #1d4ed8; padding-left: 10px;">✏️ Corrigé Détaillé</h2>
                <div style="font-size: 13.5px; color: #1f2937;">
                  ${latexToHtml(corrTexte)}
                </div>
              </div>
              
              <div style="margin-top: 50px; text-align: center; font-size: 11px; color: #9ca3af; border-top: 0.5px solid #e5e7eb; padding-top: 12px;">
                Document généré automatiquement par l'application Devoirs Maths — Enseignant : F. Nocca
              </div>
            `;

            await new Promise(r => setTimeout(r, 100));

            const canvas = await window.html2canvas(tempDiv, { scale: 1.5, useCORS: true, backgroundColor: "#ffffff" });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
            const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), m = 15;
            const iw = W - m * 2;
            let remaining = (canvas.height * iw) / canvas.width, srcY = 0;
            
            while (remaining > 0) {
              const sliceH = Math.min(remaining, H - m * 2);
              const sc = document.createElement("canvas");
              const ratio = canvas.width / iw;
              sc.width = canvas.width; sc.height = sliceH * ratio;
              sc.getContext("2d").drawImage(canvas, 0, srcY * ratio, canvas.width, sliceH * ratio, 0, 0, canvas.width, sliceH * ratio);
              if (srcY > 0) pdf.addPage();
              pdf.addImage(sc.toDataURL("image/jpeg", 0.75), "JPEG", m, m, iw, sliceH, undefined, 'FAST');
              srcY += sliceH; remaining -= sliceH;
            }

            const pdfArrayBuffer = pdf.output("arraybuffer");
            pdfB64 = uint8ToBase64(new Uint8Array(pdfArrayBuffer));
            pdfFilename = `corrige_${prenom}.pdf`;
          } catch(e) {
            console.error("Erreur PDF corrigé:", e);
            errors.push(`${c.name} (Échec génération PDF : ${e.message || e})`);
            continue;
          } finally {
            if (tempDiv && document.body.contains(tempDiv)) {
              document.body.removeChild(tempDiv);
            }
          }
          
          try {
            if (!pdfB64) throw new Error("Génération PDF non finalisée.");
            await sendGmail(c.email, subject, body, pdfB64, pdfFilename);
          } catch(e) {
            errors.push(`${c.name} (Erreur d'envoi API : ${e.message || e})`);
            console.error("Erreur envoi " + c.name, e);
          }
        }
        
        setBusy(false);
        if (errors.length === 0) {
          setMailsDone(true);
          setStatus("");
        } else {
          setMailsDone(false);
          setStatus(`⚠️ Échec d'envoi pour :\n${errors.join("\n")}`);
        }
      }

      const validCorrs = corrections.filter(c => !c.skipped);
      const notesArray = validCorrs.map(c => parseFloat(c.note)).filter(n => !isNaN(n));
      const avg = notesArray.length > 0 ? (notesArray.reduce((a,b)=>a+b,0) / notesArray.length) : 0;

      return (
        <div>
          <h1>Gestionnaire de devoirs — Maths</h1>
          
          <div class="stepper">
            <span class={`step-indicator ${step===0?'active':''}`}>1. Données</span>
            <span class={`step-indicator ${step===1?'active':''}`}>2. Analyse</span>
            <span class={`step-indicator ${step===2?'active':''}`}>3. Correction</span>
            <span class={`step-indicator ${step===3?'active':''}`}>4. Résultats</span>
          </div>

          {step === 0 && (
            <Card>
              <h2>Étape 1 : Configuration & Liste des élèves</h2>
              <div style={{ marginBottom: 16 }}>
                <label>Clé d'API Gemini</label>
                <input type="password" placeholder="AIzaSy..." value={apiKey} onChange={(e)=>setApiKey(e.target.value)}/>
              </div>
              <div style={{ marginBottom: 16 }}>
                <label>Nom du Devoir / Session</label>
                <input type="text" placeholder="Ex: DS 1 - Fonctions" value={sessionName} onChange={(e)=>setSessionName(e.target.value)}/>
              </div>
              <div>
                <label>Liste des élèves (Un par ligne : Prénom Nom email@adresse.fr)</label>
                <textarea 
                  placeholder="Jean Dupont jean.dupont@ecole.fr&#10;Marie Curie marie.curie@ecole.fr" 
                  value={studentsText} 
                  onChange={(e)=>setStudentsText(e.target.value)}
                  style={{ minHeight: 150 }}
                />
                <div style={{ fontSize: 11, color: '#6b7280', marginTop: 4 }}>
                  Total détecté : <strong>{studentsParsed.length}</strong> élève(s).
                </div>
              </div>
            </Card>
          )}

          {step === 1 && (
            <Card>
              <h2>Étape 2 : Énoncé, Barème & Copies numérisées</h2>
              <div style={{ marginBottom: 16 }}>
                <label>Sujet ou barème en texte / LaTeX (Optionnel)</label>
                <textarea 
                  placeholder="Ex: Exercice 1 (5pts): Soit f(x)=3x^2+2x..." 
                  value={latexSrc} 
                  onChange={(e)=>setLatexSrc(e.target.value)}
                />
              </div>
              <div>
                <label>Copies numérisées (Optionnel - Fusion PDF automatique)</label>
                <div class="file-drop" onDragOver={(e)=>e.preventDefault()} onDrop={handlePdfDrop}>
                  <p>Glissez-déposez vos fichiers PDF ici ou cliquez pour simuler l'analyse.</p>
                </div>
                {pdfFiles.length > 0 && (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>Fichiers retenus :</div>
                    {pdfFiles.map((f, i) => (
                      <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:12, padding:'4px 0', borderBottom:'0.5px solid #e5e7eb' }}>
                        <span>📄 {f.name} ({(f.size/1024/1024).toFixed(2)} Mo)</span>
                        <span style={{ color:'#dc2626', cursor:'pointer' }} onClick={()=>removePdf(i)}>Supprimer</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <button disabled={busy} onClick={runCorrection} style={{ width: "100%", marginTop: 20 }}>
                {busy ? "Analyse IA en cours..." : "🔮 Lancer la correction par l'IA"}
              </button>
              {status && <div class="error-container" style={{ background:'#e0f2fe', color:'#0369a1', borderColor:'#bae6fd' }}>{status}</div>}
            </Card>
          )}

          {step === 2 && (
            <Card>
              <h2>Étape 3 : Révision des notes & appréciations</h2>
              <p style={{ fontSize:12, color:'#6b7280', marginBottom:16 }}>Modifiez directement les cases ci-dessous si l'IA a fait des erreurs avant de préparer les mails.</p>
              
              {corrections.map((c) => (
                <div key={c.id} style={{ padding:12, background: c.skipped ? '#f3f4f6' : '#fff', border:'1px solid #e5e7eb', borderRadius:8, marginBottom:16 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                    <strong style={{ fontSize:14 }}>{c.name}</strong>
                    <div>
                      <label style={{ display:'inline-flex', alignItems:'center', margin:0, fontSize:12 }}>
                        <input type="checkbox" checked={c.skipped} onChange={(e)=>updateCorrectionField(c.id, 'skipped', e.target.checked)} style={{ marginRight:4 }}/> Ne pas envoyer
                      </label>
                    </div>
                  </div>

                  {!c.skipped && (
                    <div>
                      <div class="grid-2" style={{ marginBottom:8 }}>
                        <div>
                          <label style={{ fontSize:11 }}>Note /20</label>
                          <input type="text" value={c.note} onChange={(e)=>updateCorrectionField(c.id, 'note', e.target.value)}/>
                        </div>
                        <div>
                          <label style={{ fontSize:11 }}>Email de l'élève</label>
                          <input type="text" value={c.email} onChange={(e)=>updateCorrectionField(c.id, 'email', e.target.value)}/>
                        </div>
                      </div>
                      <div style={{ marginBottom:8 }}>
                        <label style={{ fontSize:11 }}>Appréciation générale</label>
                        <textarea style={{ minHeight:50 }} value={c.appreciation} onChange={(e)=>updateCorrectionField(c.id, 'appreciation', e.target.value)}/>
                      </div>
                      <div style={{ marginBottom:12 }}>
                        <label style={{ fontSize:11 }}>Conseil de progression</label>
                        <textarea style={{ minHeight:50 }} value={c.conseil} onChange={(e)=>updateCorrectionField(c.id, 'conseil', e.target.value)}/>
                      </div>

                      <div style={{ background:'#f9fafb', padding:8, borderRadius:6 }}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4 }}>
                          <span style={{ fontSize:11, fontWeight:600 }}>Détail par exercice (Pièce jointe PDF)</span>
                          <span style={{ fontSize:11, color:'#2563eb', cursor:'pointer' }} onClick={()=>addDetailRow(c.id)}>+ Ajouter un exercice</span>
                        </div>
                        {c.details.map((d, dIdx) => (
                          <div key={dIdx} style={{ display:'flex', gap:6, marginBottom:4, alignItems:'center' }}>
                            <input type="text" style={{ flex:2, fontSize:12, padding:4 }} placeholder="Ex: Ex 1" value={d.exercice} onChange={(e)=>updateDetailField(c.id, dIdx, 'exercice', e.target.value)}/>
                            <input type="text" style={{ flex:1, fontSize:12, padding:4 }} placeholder="Note" value={d.obtenu} onChange={(e)=>updateDetailField(c.id, dIdx, 'obtenu', e.target.value)}/>
                            <span style={{ fontSize:12 }}>/</span>
                            <input type="text" style={{ flex:1, fontSize:12, padding:4 }} placeholder="Total" value={d.sur} onChange={(e)=>updateDetailField(c.id, dIdx, 'sur', e.target.value)}/>
                            <input type="text" style={{ flex:4, fontSize:12, padding:4 }} placeholder="Remarque abrégée" value={d.remarque} onChange={(e)=>updateDetailField(c.id, dIdx, 'remarque', e.target.value)}/>
                            <span style={{ color:'#dc2626', cursor:'pointer', fontSize:12, padding:'0 4px' }} onClick={()=>removeDetailRow(c.id, dIdx)}>×</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </Card>
          )}

          {step === 3 && (
            <Card>
              <h2>Étape 4 : Diffusion des résultats</h2>
              <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                <button onClick={exportCsv} style={{ flex: 1, fontSize: 12, background: "#f3f4f6", color: "#374151", border: "0.5px solid #d1d5db" }}>📊 CSV</button>
                <button onClick={exportPdfRecap} disabled={!libsOk.jspdf} style={{ flex: 1, fontSize: 12, background: "#f3f4f6", color: "#374151", border: "0.5px solid #d1d5db" }}>📄 PDF récap</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))", gap: 12, marginBottom: 16 }}>
                {validCorrs.map(c => {
                  const nc = !isNaN(+c.note) ? (+c.note >= 10 ? "#16a34a" : "#dc2626") : "#6b7280";
                  return (
                    <div key={c.id} style={{ background: "#f3f4f6", borderRadius: 8, padding: 14, textAlign: "center" }}>
                      <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 4 }}>{c.name}</div>
                      <div style={{ fontSize: 26, fontWeight: 500, color: nc }}>{c.note}<span style={{ fontSize: 14, color: "#6b7280" }}>/20</span></div>
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", justifyInterieur: "space-between", justifyContent: "space-between", padding: "10px 0", borderTop: "0.5px solid #e5e7eb" }}>
                <span style={{ fontSize: 13, color: "#6b7280" }}>Moyenne de classe</span>
                <span style={{ fontSize: 18, fontWeight: 500 }}>{validCorrs.length > 0 ? avg.toFixed(1) : "—"}/20</span>
              </div>

              <div style={{ background: "#f0fdf4", border: "0.5px solid #86efac", borderRadius: 8, padding: "10px 12px", margin: "12px 0", fontSize: 12, color: "#166534" }}>
                ✉️ Les e-mails seront envoyés depuis le **compte Google auquel vous vous connecterez** dans la fenêtre d'authentification.<br/>
                Veuillez vérifier le dossier "Messages envoyés" de cette même adresse pour le suivi.
              </div>
              
              {mailsDone ? (
                <div style={{ textAlign: "center", padding: "1.5rem" }}>
                  <div style={{ fontSize: 28, marginBottom: 8 }}>✅</div>
                  <span style={{ fontWeight: 500, color: "#16a34a" }}>Mails envoyés à tous les élèves !</span>
                </div>
              ) : (
                <div>
                  <button disabled={busy} onClick={sendResults} style={{ width: "100%", marginTop: 8 }}>
                    {busy ? "Envoi en cours..." : "📬 Préparer et envoyer les résultats"}
                  </button>
                  {status && (
                    <div style={{ marginTop: 10, padding: 10, borderRadius: 6, fontSize: 12, whiteSpace: "pre-wrap", background: status.includes("⚠️") || status.includes("❌") ? "#fee2e2" : "#dbeafe", color: status.includes("⚠️") || status.includes("❌") ? "#dc2626" : "#1d4ed8" }}>
                      {status}
                    </div>
                  )}
                </div>
              )}
            </Card>
          )}

          <div style={{ display: "flex", justifyContent: "space-between", marginTop: "1.5rem" }}>
            {step > 0 ? <button style={{ background: "#f3f4f6", color: "#374151", border: "0.5px solid #d1d5db" }} disabled={busy} onClick={() => { setStep(step - 1); setStatus(""); }}>← Retour</button> : <div/>}
            {step < 3 && <button disabled={!canNext || busy || !apiKey} onClick={() => { setStep(step + 1); setStatus(""); }}>
              {["Diffuser →", "Corriger les copies →", "Voir les résultats →"][step]}
            </button>}
          </div>
          <p style={{ textAlign: "center", fontSize: 11, color: "#9ca3af", marginTop: "2rem" }}>Propulsé par Google Gemini</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
