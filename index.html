    /* ── Gmail OAuth & Utilities ── */
    const GMAIL_CLIENT_ID = "3675385834-a42o3cc2lmpasjd8hf23o0jiu6ebbkah.apps.googleusercontent.com";
    const GMAIL_API_KEY   = "AIzaSyDxIzc5-HY279Lz99mElq4pBm0q5o3OB3Y";
    const GMAIL_SENDER    = "maths.perriand@gmail.com";
    const GMAIL_SCOPE     = "https://www.googleapis.com/auth/gmail.send";

    let gmailAccessToken = null;

    function getGmailToken() {
      return new Promise((resolve, reject) => {
        if (gmailAccessToken) { resolve(gmailAccessToken); return; }
        if (!window.google?.accounts?.oauth2) {
          reject(new Error("Google Identity Services non chargé")); return;
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) { settled = true; reject(new Error("Délai dépassé — réessayez")); }
        }, 120000);
        const client = window.google.accounts.oauth2.initTokenClient({
          client_id: GMAIL_CLIENT_ID,
          scope: GMAIL_SCOPE,
          login_hint: GMAIL_SENDER,
          callback: (resp) => {
            clearTimeout(timer);
            if (settled) return;
            settled = true;
            if (resp.error) { reject(new Error(resp.error)); return; }
            gmailAccessToken = resp.access_token;
            setTimeout(() => { gmailAccessToken = null; }, (resp.expires_in - 60) * 1000);
            resolve(gmailAccessToken);
          },
          error_callback: (err) => {
            clearTimeout(timer);
            if (!settled) { settled = true; reject(new Error(err.type || "Autorisation refusée")); }
          }
        });
        client.requestAccessToken({ prompt: "select_account" });
      });
    }

    async function mergePdfs(pdfList) {
      if (pdfList.length === 1) return pdfList[0].b64;
      const { PDFDocument } = window.PDFLib;
      const merged = await PDFDocument.create();
      for (const p of pdfList) {
        const bytes = Uint8Array.from(atob(p.b64), c => c.charCodeAt(0));
        const doc   = await PDFDocument.load(bytes);
        const pages = await merged.copyPages(doc, doc.getPageIndices());
        pages.forEach(pg => merged.addPage(pg));
      }
      const bytes = await merged.save();
      return uint8ToBase64(bytes);
    }

    function uint8ToBase64(bytes) {
      let binary = "";
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function b64url(str) {
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    }

    function chunkBase64(str) {
      if (!str) return "";
      const chunks = [];
      for (let i = 0; i < str.length; i += 76) {
        chunks.push(str.substring(i, i + 76));
      }
      return chunks.join("\r\n");
    }

    function buildMime(to, subject, body) {
      const msg = [
        `From: ${GMAIL_SENDER}`,
        `To: ${to}`,
        `Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,
        "MIME-Version: 1.0",
        "Content-Type: text/plain; charset=utf-8",
        "Content-Transfer-Encoding: base64",
        "",
        chunkBase64(btoa(unescape(encodeURIComponent(body))))
      ].join("\r\n");
      return b64url(msg);
    }

    function buildMimeWithPdf(to, subject, body, pdfBase64, pdfFilename) {
      const boundary = "boundary_" + Math.random().toString(36).slice(2);
      const parts = [
        `From: ${GMAIL_SENDER}`,
        `To: ${to}`,
        `Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,
        "MIME-Version: 1.0",
        `Content-Type: multipart/mixed; boundary="${boundary}"`,
        "",
        `--${boundary}`,
        "Content-Type: text/plain; charset=utf-8",
        "Content-Transfer-Encoding: base64",
        "",
        chunkBase64(btoa(unescape(encodeURIComponent(body)))),
        "",
        `--${boundary}`,
        `Content-Type: application/pdf; name="${pdfFilename}"`,
        "Content-Transfer-Encoding: base64",
        `Content-Disposition: attachment; filename="${pdfFilename}"`,
        "",
        chunkBase64(pdfBase64),
        "",
        `--${boundary}--`
      ].join("\r\n");
      return b64url(parts);
    }

    async function sendGmail(to, subject, body, pdfBase64=null, pdfFilename=null) {
      const token = await getGmailToken();
      const raw   = pdfBase64
        ? buildMimeWithPdf(to, subject, body, pdfBase64, pdfFilename)
        : buildMime(to, subject, body);
      const res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ raw }),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || "Erreur Gmail");
      }
    }

    /* ── Gestionnaire de sessions ── */
    const ROOT = "prof_maths_sessions";
    const ACTIVE_KEY = "prof_maths_active";

    function getAllSessions() {
      try { return JSON.parse(localStorage.getItem(ROOT) || "{}"); } catch { return {}; }
    }
    function saveSession(id, data) {

    function getActiveId() {

    function newSessionId() {

    const delay = ms => new Promise(res => setTimeout(res, ms));

    /* ── API Google Gemini avec gestion de file d'attente (Backoff) ── */
    async function callGemini(apiKey, parts, systemInstruction = null, jsonMode = false, model = "gemini-2.5-flash", onRetryNotify = null) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const body = { contents: [{ parts: parts }] };
      
      const generationConfig = { temperature: 0 };
      if (jsonMode) generationConfig.responseMimeType = "application/json";
      
      body.generationConfig = generationConfig;
      if (systemInstruction) {
        body.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      let attempt = 0;
      const maxAttempts = 5;
      let backoffDelay = 5000;

      while (attempt < maxAttempts) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (res.status === 429) {
            attempt++;
            if (attempt >= maxAttempts) {
              throw new Error(`Limite de l'API Google persistante. Veuillez patienter.`);
            }
            if (onRetryNotify) onRetryNotify(`Quota saturé (429). Pause de ${backoffDelay / 1000}s...`);
            await delay(backoffDelay);
            backoffDelay *= 1.5;
            continue;
          }

          const data = await res.json();
          if (data.error) {
            if (data.error.code === 429 || data.error.message?.toLowerCase().includes("quota")) {
              attempt++;
              if (attempt >= maxAttempts) throw new Error(data.error.message);
              if (onRetryNotify) onRetryNotify(`Quota atteint. Attente de ${backoffDelay / 1000}s...`);
              await delay(backoffDelay);
              backoffDelay *= 1.5;
              continue;
            }
            throw new Error(data.error.message);
          }
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        } catch (error) {
          if (error.message?.includes("429") || error.message?.toLowerCase().includes("quota") || error.message?.toLowerCase().includes("fetch")) {
            attempt++;
            if (attempt >= maxAttempts) throw error;
            if (onRetryNotify) onRetryNotify(`Instabilité réseau. Pause de ${backoffDelay / 1000}s...`);
            await delay(backoffDelay);
            backoffDelay *= 1.5;
            continue;
          }
          throw error;
        }
      }
    }

    function parseStudents(raw) {
      return raw.trim().split("\n").filter(Boolean).map((line, i) => {
        const [name, email] = line.split(",").map(s => s.trim());
        return { id: i, name: name || `Élève ${i+1}`, email: email || "" };
      });
    }

    function safeJSONParse(rawText) {
      try {
        let cleanRaw = rawText.trim();
        if (cleanRaw.startsWith('```json')) {
          cleanRaw = cleanRaw.replace(/^```json/, '').replace(/```$/, '').trim();
        } else if (cleanRaw.startsWith('```')) {
          cleanRaw = cleanRaw.replace(/^```/, '').replace(/```$/, '').trim();
        }
        return JSON.parse(cleanRaw);
      } catch (error) {
        console.error("Erreur de parsing JSON :", error, rawText);
        throw new Error("L'IA a renvoyé un format illisible.");
      }
    }

    function latexToHtml(src) {
      if (!src) return "";
      if (!window.katex) return `<pre>${src}</pre>`;
      let html = src
        .replace(/\$$([\s\S]+?)\$\$/g, (_, m) => {
          try { return `<div style="margin:20px 0;text-align:center;font-size:1.15em;">${window.katex.renderToString(m, { displayMode:true, throwOnError:false })}</div>`; }
          catch { return `<div>$$${m}$$</div>`; }
        })
        .replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => {
          try { return `<div style="margin:20px 0;text-align:center;font-size:1.15em;">${window.katex.renderToString(m, { displayMode:true, throwOnError:false })}</div>`; }
          catch { return `\\[${m}\\]`; }
        })
        .replace(/\$([^\$\n]+?)\$/g, (_, m) => {
          try { return window.katex.renderToString(m, { displayMode:false, throwOnError:false }); }
          catch { return `$${m}$`; }
        })
        .replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => {
          try { return window.katex.renderToString(m, { displayMode:false, throwOnError:false }); }
          catch { return `\\(${m}\\)`; }
        });

      html = html
        .replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, '<div style="text-align:center">$1</div>')
        .replace(/\\textbf\{([^}]+)\}/g, '<strong>$1</strong>')
        .replace(/\\textit\{([^}]+)\}/g, '<em>$1</em>')
        .replace(/\\underline\{([^}]+)\}/g, '<u>$1</u>')
        .replace(/\{\\Large\\textbf\{([^}]+)\}\}/g, '<h1 style="font-size:16pt;text-align:center;margin:12px 0">$1</h1>')
        .replace(/\\section\*?\{([^}]+)\}/g, '<h2 style="font-size:14pt;margin-top:24px;margin-bottom:12px">$1</h2>')
        .replace(/\\subsection\*?\{([^}]+)\}/g, '<h3 style="font-size:12pt;margin-top:16px;margin-bottom:8px">$1</h3>')
        .replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g, (_, body) =>
          `<ol style="padding-left:24px;margin:12px 0">${body.replace(/\\item\s+/g,'<li>').replace(/<li>([^<]*)/g,'<li>$1</li>')}</ol>`)
        .replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g, (_, body) =>
          `<ul style="padding-left:24px;margin:12px 0">${body.replace(/\\item\s+/g,'<li>').replace(/<li>([^<]*)/g,'<li>$1</li>')}</ul>`)
        .replace(/\\hfill/g, '<span style="float:right">')
        .replace(/\\\\(\[[\d.]+pt\])?/g, '<br/>')
        .replace(/\\vspace\{[^}]+\}/g, '<div style="height:10px"></div>')
        .replace(/\\newline/g, '<br/>')
        .replace(/\\hline/g, '')
        .replace(/\\[a-zA-Z]+\{([^}]*)\}/g, '$1')
        .replace(/\\[a-zA-Z]+/g, '')
        .replace(/\n{2,}/g, '</p><p style="margin:10px 0">');
      return '<p style="margin:10px 0">' + html + '</p>';
    }

    /* ── SessionManager ── */
    function SessionManager({ onSelect }) {
      const [sessions, setSessions] = useState(() => getAllSessions());
      const [newName,  setNewName]  = useState("");

      const refresh = () => setSessions(getAllSessions());

      const create = () => {
        const name = newName.trim() || "Devoir du " + new Date().toLocaleDateString("fr-FR");
        const id = newSessionId();
        saveSession(id, { name, createdAt: Date.now() });
        setNewName(""); refresh(); onSelect(id, name);
      };

      const open = (id) => {
        const s = getAllSessions()[id];
        onSelect(id, s.name);
      };

      const del = (id, e) => {
        e.stopPropagation();
        if (window.confirm("Supprimer ce devoir et toutes ses données ?")) {
          deleteSession(id); refresh();
        }
      };

      const entries = Object.entries(sessions).sort((a,b) => (b[1].createdAt||0)-(a[1].createdAt||0));
      const lastId  = getActiveId();
      const lastSession = lastId && sessions[lastId] ? sessions[lastId] : null;

      return (
        <div style={{ maxWidth:700, margin:"0 auto", padding:"2rem 1rem" }}>
          <h1 style={{ marginBottom:8 }}>📐 Gestionnaire de devoirs (Gemini)</h1>
          <p style={{ fontSize:13, color:"#6b7280", marginBottom:"1.5rem" }}>Chaque devoir est indépendant — ouvrez-en plusieurs dans des onglets différents.</p>

          {lastSession && (
            <div style={{ background:"#dbeafe", border:"0.5px solid #93c5fd", borderRadius:10, padding:"14px 16px", marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ fontSize:12, color:"#1d4ed8", marginBottom:2 }}>Dernier devoir ouvert</div>
                <div style={{ fontWeight:500 }}>{lastSession.name}</div>
              </div>
              <button onClick={()=>onSelect(lastId, lastSession.name)} style={{ background:"#1d4ed8", border:"none", flexShrink:0 }}>
                Reprendre →
              </button>
            </div>
          )}

          <Card>
            <div style={{ fontSize:14, fontWeight:500, marginBottom:10 }}>➕ Nouveau devoir</div>
            <div style={{ display:"flex", gap:8 }}>
              <input type="text" value={newName} onChange={e=>setNewName(e.target.value)}
                placeholder="Ex : Terminale – Suites – Jan 2025"
                onKeyDown={e=>e.key==="Enter"&&create()}
                style={{ flex:1 }}/>
              <button onClick={create} style={{ flexShrink:0 }}>Créer</button>
            </div>
          </Card>

          {entries.length > 0 && (
            <Card>
              <div style={{ fontSize:14, fontWeight:500, marginBottom:10 }}>📂 Devoirs existants</div>
              {entries.map(([id, s]) => (
                <div key={id} onClick={()=>open(id)} style={{
                  display:"flex", justifyContent:"space-between", alignItems:"center",
                  padding:"10px 12px", marginBottom:6, borderRadius:8, cursor:"pointer",
                  background:"#f3f4f6", border:"0.5px solid #e5e7eb",
                  transition:"background 0.15s",
                }} onMouseEnter={e=>e.currentTarget.style.background="#e5e7eb"}
                   onMouseLeave={e=>e.currentTarget.style.background="#f3f4f6"}>
                  <div>
                    <div style={{ fontWeight:500, fontSize:14 }}>{s.name}</div>
                    <div style={{ fontSize:11, color:"#9ca3af" }}>
                      {s.createdAt ? new Date(s.createdAt).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}) : ""}
                      {s.step > 0 ? ` — Étape ${s.step+1}/4` : ""}
                      {s.corrections?.length > 0 ? ` — ${s.corrections.filter(c=>!c.skipped).length} copie(s) corrigée(s)` : ""}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    <span style={{ fontSize:12, color:"#1d4ed8", fontWeight:500 }}>Ouvrir →</span>
                    <span onClick={e=>del(id,e)} style={{ fontSize:12, color:"#dc2626", cursor:"pointer", padding:"2px 6px", borderRadius:4 }}>✕</span>
                  </div>
                </div>
              ))}
            </Card>
          )}

          {entries.length === 0 && (
            <p style={{ textAlign:"center", color:"#9ca3af", fontSize:13, marginTop:"2rem" }}>Aucun devoir sauvegardé — créez-en un ci-dessus.</p>
          )}
        </div>
      );
    }

    function App() {
      const [sessionId,   setSessionId]   = useState(null);
      const [sessionName, setSessionName] = useState("");

      const openSession = (id, name) => {
        setActiveId(id); setSessionId(id); setSessionName(name);
      };

      if (!sessionId) {
        return <SessionManager onSelect={openSession}/>;
      }

      return <Devoir sessionId={sessionId} sessionName={sessionName} onBack={()=>{ setSessionId(null); setSessionName(""); }}/>;
    }

    /* ── Devoir (logique principale) ── */
    function Devoir({ sessionId, sessionName, onBack }) {
      const load = (key, fallback) => { const s=getSession(sessionId); return s[key]!==undefined?s[key]:fallback; };
      const persist = (key, val) => {
        const s=getSession(sessionId); s[key]=val; saveSession(sessionId, {...getAllSessions()[sessionId],...s,[key]:val});
      };

      const [apiKey,  setApiKey]  = useState(() => { try{return localStorage.getItem("prof_maths_gemini_apikey")||"";}catch{return "";} });
      const [modelChoice, setModelChoiceRaw] = useState(() => load("modelChoice", "gemini-2.5-flash"));
      const [step,    setStepRaw] = useState(() => load("step", 0));
      const setStep = v => { setStepRaw(v); persist("step",v); };
      const [busy,    setBusy]    = useState(false);
      const [status,  setStatus]  = useState("");
      const [progress, setProgress] = useState(0); 
      const [libsOk,  setLibsOk]  = useState({ h2c: !!window.html2canvas, jspdf: !!window.jspdf });

      useEffect(()=>{ try{localStorage.setItem("prof_maths_gemini_apikey",apiKey);}catch{} },[apiKey]);
      
      const setModelChoice = v => { setModelChoiceRaw(v); persist("modelChoice", v); };

      /* Étape 0 */
      const [upSubPdf,     setUpSubPdf]        = useState(null);
      const [upSubPdfName, setUpSubPdfNameRaw] = useState(() => load("upSubPdfName", ""));
      const setUpSubPdfName = v => { setUpSubPdfNameRaw(v); persist("upSubPdfName",v); };

      /* Étape 1 */
      const [studentsRaw,   setStudentsRawRaw]   = useState(() => load("studentsRaw", ""));
      const setStudentsRaw = v => { setStudentsRawRaw(v); persist("studentsRaw",v); };
      const [extracting,    setExtracting]        = useState(false);
      const [copiesPdfs,    setCopiesPdfsRaw]     = useState([]);

      const setCopiesPdfs = (v) => {
        if (typeof v === 'function') {
          setCopiesPdfsRaw(prev => {
            const next = v(prev);
            persist("copiesPdfsCount", next.length);
            return next;
          });
        } else {
          setCopiesPdfsRaw(v);
          persist("copiesPdfsCount", v.length);
        }
      };

      /* Étape 2 */
      const [corrections, setCorrectionsRaw] = useState(() => load("corrections", []));
      
      const setCorrections = v => {
        if (typeof v === 'function') {
          setCorrectionsRaw(prev => {
            const next = v(prev);
            persist("corrections", next);
            return next;
          });
        } else {
          setCorrectionsRaw(v);
          persist("corrections", v);
        }
      };

      const updateCorrection = (id, field, value) => {
        setCorrections(prev => prev.map(c => c.id === id ? { ...c, [field]: value } : c));
      };

      /* Étape 3 */
      const [mailsDone,   setMailsDoneRaw]   = useState(() => load("mailsDone", false));
      const setMailsDone = v => { setMailsDoneRaw(v); persist("mailsDone",v); };

      useEffect(()=>{
        const check = () => setLibsOk({ h2c:!!window.html2canvas, jspdf:!!window.jspdf });
        const t = setInterval(check, 500); return () => clearInterval(t);
      },[]);

      const students    = parseStudents(studentsRaw);
      const validCorrs  = corrections.filter(c=>!c.skipped);
      const avg         = validCorrs.filter(c=>!isNaN(+c.note)).reduce((a,c,_,arr)=>a+ +c.note/arr.length,0);
      const copiesPdfName = copiesPdfs.map(p=>p.name).join(", ");
      
      const canNext     = [!!upSubPdf, students.length > 0, corrections.length>0, true][step];

      const readPdf = (file, cb) => {
        const r = new FileReader(); r.onload = e => cb(e.target.result.split(",")[1]); r.readAsDataURL(file);
      };

      const addCopiesPdf = (files) => {
        const arr = Array.from(files).filter(f=>f.type==="application/pdf");
        if (!arr.length) return;
        
        let loaded = 0;
        let firstB64 = null;
        
        arr.forEach(file => {
          readPdf(file, b64 => {
            if (loaded === 0) {
              firstB64 = b64;
            }
            setCopiesPdfs(prev => [...prev, {name: file.name, b64}]);
            loaded++;
            
            if (loaded === arr.length && firstB64) {
              extractNames(firstB64);
            }
          });
        });
      };

      const handleSubjectPdf = (file) => {
        if (!file||file.type!=="application/pdf") return;
        setUpSubPdfName(file.name);
        readPdf(file, b64 => setUpSubPdf(b64));
      };

      const extractNames = async (b64) => {
        if (!b64 || !apiKey) return;
        setExtracting(true);
        setStatus("Extraction automatique des profils élèves depuis les copies...");
        try {
          const parts = [
            { inlineData: { mimeType: "application/pdf", data: b64 } },
            { text: "Extrais le nom complet et l'email de chaque élève présent dans ces copies.\nRetourne uniquement un tableau JSON contenant des objets avec les clés 'name' et 'email'. Si aucun email n'est visible, laisse la chaîne vide \"\"." }
          ];
          const raw = await callGemini(apiKey, parts, "Tu extrais exclusivement des listes d'élèves. Réponds en JSON pur.", true, modelChoice.includes("flash") ? modelChoice : "gemini-2.5-flash", (msg) => {
            setStatus(`[Extraction] ${msg}`);
          });
          const arr = safeJSONParse(raw);
          if (Array.isArray(arr)) {
            const formatted = arr.map(s => s.email ? `${s.name}, ${s.email}` : s.name).join("\n");
            setStudentsRaw(formatted);
            setStatus("✅ Liste d'élèves extraite.");
          }
        } catch(e) { 
          setStatus("⚠️ L'extraction automatique a échoué (Limite API ou lecture).");
        }
        setExtracting(false);
      };

      /* ── Correction globale directe sans pagination manuelle ── */
      const executeCorrection = async () => {
        if (!copiesPdfs.length || !apiKey || !students.length) return;
        setBusy(true);
        setStatus("Préparation du lot de copies...");
        setProgress(5);

        let mergedB64;
        try { mergedB64 = await mergePdfs(copiesPdfs); }
        catch(e) { setStatus("❌ Erreur fusion PDF : "+e.message); setBusy(false); return; }

        const results = [];

        for (let i = 0; i < students.length; i++) {
          const s = students[i];

          setStatus(`Recherche et correction de ${s.name} (${i + 1}/${students.length}) via ${modelChoice}…`);
          setProgress(10 + Math.round((i / students.length) * 90));

          if (i > 0) {
            const spacingDelay = modelChoice.includes("pro") ? 30000 : 3000;
            let count = spacingDelay / 1000;
            while (count > 0) {
              setStatus(`Temporisation réseau (${count}s) avant la copie de ${s.name}...`);
              await delay(1000);
              count--;
            }
          }

          const systemInstruction = `Tu es un correcteur de mathématiques impartial et rigoureux. Adopte la posture d'un coach bienveillant : tutoie l'élève et utilise son prénom. Ton JSON ne doit JAMAIS dépasser la taille limite, sois concis dans tes explications LaTeX.`;

          try {
            const parts = [];
            if (upSubPdf) {
               parts.push({ inlineData: { mimeType: "application/pdf", data: upSubPdf } });
            }
            parts.push({ inlineData: { mimeType: "application/pdf", data: mergedB64 } });
            parts.push({ text: `Dans le document joint (qui contient les copies de la classe), LOCALISE UNIQUEMENT la copie de l'élève nommé EXACTEMENT "${s.name}".
            
TÂCHE : Corrige exclusivement SA copie en te basant sur le sujet fourni.
Si tu ne trouves absolument pas sa copie dans ce document, attribue-lui une note de 0, passe reviewNeeded à true, et indique-le dans l'appréciation.

CORRIGÉ ATTENDU :
Évalue chaque sous-question. Ne pénalise pas deux fois une erreur propagée.

RÈGLES DE SAISIE LATEX (CRITIQUE POUR LA BEAUTÉ DES MATHÉMATIQUES) :
- Isole impérativement les formules importantes ou longues sur leur propre ligne en utilisant $$ ... $$ ou \\[ ... \\].
- TOUTES les variables et petits calculs intégrés dans le texte ('remarque', 'appreciation', 'conseil') DOIVENT être entourés d'un simple dollar ($).
- Dédouble IMPÉRATIVEMENT les antislashs pour que le JSON ne plante pas (ex: \\\\frac, \\\\section, \\\\[, \\\\]).

FORMAT DE RÉPONSE JSON STRICT :
{
  "note": 14.25,
  "reviewNeeded": false,
  "analyse_decryptage_brouillon": "...",
  "appreciation": "${s.name.split(" ")[0]}, ton travail montre que...",
  "details": [
    {
      "exercice": "Ex 1 - Q1",
      "sur": 2.0,
      "obtenu": 1.0,
      "remarque": "Bonne méthode."
    }
  ],
  "conseil": "Relis tes formules.",
  "latexCorrection": "\\\\section*{Corrigé détaillé}\\\\n\\\\subsection*{Exercice 1}\\\\n..."
}` });

            const raw = await callGemini(apiKey, parts, systemInstruction, true, modelChoice, (msg) => {
              setStatus(`[Copie de ${s.name}] ${msg}`);
            });
            const parsed = safeJSONParse(raw);
            results.push({...s, ...parsed});
          } catch(e) {
            results.push({...s, note:"?", appreciation:"Erreur IA : "+e.message, details:[], conseil:"", latexCorrection:""});
          }
        }

        setProgress(100);
        setCorrections(results);
        setBusy(false);
        setStatus("✅ Évaluation par lots terminée !");
        setTimeout(() => setStatus(""), 4000);
      };

      const exportCsv = () => {
        const allDetails = validCorrs[0]?.details || [];
        const detHeaders = allDetails.map(d => `"${d.exercice} (obtenu/sur)","${d.exercice} (remarque)"`).join(",");
        const header = `"Nom","Note /20","Appréciation","Conseil",${detHeaders}`;
        const rows = validCorrs.map(c => {
          const base = [
            `"${c.name}"`,
            `"${c.note}"`,
            `"${(c.appreciation||"").replace(/"/g,"'")}"`,
            `"${(c.conseil||"").replace(/"/g,"'")}"`
          ].join(",");
          const detCells = allDetails.map((_,i) => {
            const d = c.details?.[i];
            return d
              ? `"${d.obtenu}/${d.sur}","${(d.remarque||"").replace(/"/g,"'")}"`
              : `"",""`; 
          }).join(",");
          return base + "," + detCells;
        });
        const bom = "\uFEFF";
        const a = document.createElement("a");
        a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(bom + [header,...rows].join("\n"));
        a.download = `corrections_${sessionName.replace(/[^a-z0-9]/gi,"_")}.csv`;
        a.click();
      };

      const exportPdfRecap = () => {
        if(!libsOk.jspdf)return;
        const {jsPDF}=window.jspdf;
        const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
        const marg=15;let y=marg;const pw=180,lh=6;
        const addLine=(txt,opts={})=>{
          if(y>270){pdf.addPage();y=marg;}
          pdf.setFont("helvetica",opts.bold?"bold":"normal");
          pdf.setFontSize(opts.size||10);pdf.setTextColor(...(opts.color||[0,0,0]));
          const lines=pdf.splitTextToSize(txt,pw);pdf.text(lines,marg,y);
          y+=lines.length*lh+(opts.after||0);
        };
        addLine(`Récapitulatif — ${sessionName}`,{bold:true,size:14,after:4});
        addLine(`Moyenne de classe : ${avg.toFixed(1)}/20`,{size:11,color:[80,80,80],after:6});
        validCorrs.forEach(c=>{
          if(y>250){pdf.addPage();y=marg;}
          pdf.setDrawColor(200,200,200);pdf.line(marg,y,marg+pw,y);y+=4;
          const col=!isNaN(+c.note)?(+c.note>=10?[22,163,74]:[220,38,38]):[0,0,0];
          addLine(`${c.name}  —  ${c.note}/20`,{bold:true,size:12,color:col,after:2});
          addLine(c.appreciation||"",{size:9,color:[80,80,80],after:2});
          c.details?.forEach(d=>addLine(`• ${d.exercice} : ${d.obtenu}/${d.sur} — ${d.remarque}`,{size:8.5,color:[60,60,60]}));
          if(c.conseil){y+=2;addLine(`Conseil : ${c.conseil}`,{size:8.5,color:[80,80,180],after:4});}else y+=4;
        });
        pdf.save(`corrections_${sessionName.replace(/[^a-z0-9]/gi,"_")}.pdf`);
      };

      /* ── Génération des PDF "Magnifiques Mathématiques" bloc par bloc ── */
      const sendResults = async () => {
        setBusy(true); setProgress(0);
        try {
          setStatus("Connexion Gmail — choisissez maths.perriand@gmail.com…");
          await getGmailToken();
        } catch(e) {
          setStatus("❌ " + (e.message || e) + " — Réessayez.");
          setBusy(false); return;
        }
        let errors = [];
        const activeStudents = corrections.filter(c => !c.skipped && c.email);
        let idx = 0;
        
        const firstWithCorrection = corrections.find(x => !x.skipped && x.latexCorrection);
        const generalLatexCorrection = firstWithCorrection ? firstWithCorrection.latexCorrection : "";

        for(const c of corrections){
          if(c.skipped||!c.email)continue;
          setStatus(`Envoi à ${c.name}…`);
          setProgress(Math.round((idx / activeStudents.length) * 100));
          
          const prenom = c.name.split(" ")[0];
          const appreciation = (c.appreciation||"").replace(/il\/elle/gi,"tu").replace(/l'élève/gi,"tu").replace(new RegExp(c.name,"gi"), prenom);
          const conseil = (c.conseil||"").replace(/il\/elle/gi,"tu").replace(/l'élève/gi,"tu").replace(new RegExp(c.name,"gi"), prenom);
          
          const body = `Bonjour ${prenom},\n\nVoici ton résultat pour le devoir de mathématiques "${sessionName}".\n\nTu trouveras en pièce jointe ton bilan personnalisé contenant ta note globale (${c.note}/20), tes appréciations détaillées par exercice ainsi que le corrigé complet de l'épreuve.\n\nCordialement,\nF. Nocca`;
          const subject = `Résultats – ${sessionName}`;
          let pdfB64 = null, pdfFilename = null;

          try {
            setStatus(`Génération du document PDF haute-résolution pour ${prenom}…`);
            
            const hiddenDiv = document.createElement("div");
            hiddenDiv.style.position = "absolute";
            hiddenDiv.style.top = "-9999px";
            hiddenDiv.style.left = "-9999px";
            hiddenDiv.style.width = "800px";
            hiddenDiv.style.background = "#ffffff";
            hiddenDiv.style.color = "#111827";
            hiddenDiv.style.fontFamily = "system-ui, -apple-system, sans-serif";
            
            const appendBlock = (htmlContent, padding="20px 40px") => {
              const block = document.createElement("div");
              block.className = "pdf-block";
              block.style.padding = padding;
              block.innerHTML = htmlContent;
              hiddenDiv.appendChild(block);
            };

            appendBlock(`
              <div style="border-bottom: 2px solid #e5e7eb; padding-bottom: 15px;">
                <h1 style="font-size:34px; margin:0 0 10px 0;">Bilan personnalisé et Corrigé</h1>
                <h2 style="font-size:24px; margin:0 0 10px 0; color:#4b5563;">Élève : ${c.name}</h2>
                <h2 style="font-size:28px; margin:0; color:${!isNaN(+c.note) && +c.note >= 10 ? '#16a34a' : '#dc2626'};">Note : ${c.note}/20</h2>
              </div>
            `, "40px 40px 10px 40px");

            if (appreciation) {
              appendBlock(`<div style="font-size:17px; line-height:1.6;"><strong>Appréciation :</strong><br/> ${latexToHtml(appreciation)}</div>`, "10px 40px");
            }

            const detailsHtml = (c.details||[]).map(d => 
              `<div style="margin-bottom: 12px; padding: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;">
                <b style="color: #1d4ed8; font-size: 18px;">${d.exercice}</b> : <span style="font-weight: 600; font-size: 18px;">${d.obtenu}/${d.sur}</span> 
                ${d.remarque ? `<div style="margin-top: 8px; color: #374151;">${latexToHtml(d.remarque)}</div>` : ''}
              </div>`
            ).join("");

            appendBlock(`
              <div style="background: #f9fafb; padding: 20px; border-radius: 8px;">
                <h3 style="margin-top:0; font-size:22px; color: #111827;">Détail par exercice</h3>
                <div style="font-size:16px; line-height:1.6;">${detailsHtml}</div>
              </div>
            `, "15px 40px");

            if (conseil) {
              appendBlock(`
                <div style="font-size:17px; line-height:1.6; padding: 16px; background: #eff6ff; border-left: 4px solid #3b82f6; border-radius: 6px;">
                  <strong>Conseil :</strong><br/> ${latexToHtml(conseil)}
                </div>
              `, "10px 40px");
            }

            appendBlock(`
              <div style="border-top: 2px solid #e5e7eb; padding-top: 20px;">
                <h3 style="margin-top:0; font-size:24px;">Corrigé détaillé</h3>
              </div>
            `, "20px 40px 10px 40px");

            const tempCorr = document.createElement("div");
            tempCorr.innerHTML = generalLatexCorrection ? latexToHtml(generalLatexCorrection) : '<p style="font-style:italic">Aucun corrigé détaillé disponible.</p>';
            
            // On divise le corrigé en multiples blocs pour éviter que les équations ne soient coupées entre 2 pages
            Array.from(tempCorr.childNodes).forEach(node => {
              if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) return;
              const block = document.createElement("div");
              block.className = "pdf-block";
              block.style.padding = "6px 40px";
              block.style.fontSize = "17px";
              block.style.lineHeight = "1.8";
              if (node.nodeType === Node.TEXT_NODE) {
                block.textContent = node.textContent;
              } else {
                block.appendChild(node.cloneNode(true));
              }
              hiddenDiv.appendChild(block);
            });
            
            document.body.appendChild(hiddenDiv);
            await new Promise(r => setTimeout(r, 250)); // Laisse KaTeX et le navigateur peindre la page

            const {jsPDF} = window.jspdf;
            const pdf = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
            const W = pdf.internal.pageSize.getWidth();
            const H = pdf.internal.pageSize.getHeight();
            const m = 15;
            const iw = W - m*2;
            let currentY = m;
            
            const blocks = Array.from(hiddenDiv.querySelectorAll('.pdf-block'));

            for (let i = 0; i < blocks.length; i++) {
              const b = blocks[i];
              if (!b.innerText.trim() && !b.querySelector('.katex')) continue;
              
              // scale: 2.5 pour une netteté chirurgicale (Magnifiques Mathématiques)
              const canvas = await window.html2canvas(b, {scale: 2.5, useCORS: true, backgroundColor: "#ffffff"}); 
              const imgH = (canvas.height * iw) / canvas.width;
              
              // Saut de page intelligent si le bloc ne rentre pas
              if (currentY + imgH > H - m && currentY > m + 10) {
                pdf.addPage();
                currentY = m;
              }
              
              // Sécurité anti-débordement pour un bloc immense (rare)
              if (imgH > H - 2*m) {
                let remaining = imgH;
                let srcY = 0;
                const canvasRatio = canvas.width / iw;
                while(remaining > 0) {
                  const sliceH = Math.min(remaining, H - currentY - m);
                  const slicePixH = sliceH * canvasRatio;
                  
                  const sc = document.createElement("canvas");
                  sc.width = canvas.width;
                  sc.height = slicePixH;
                  sc.getContext("2d").drawImage(canvas, 0, srcY, canvas.width, slicePixH, 0, 0, sc.width, sc.height);
                  
                  pdf.addImage(sc.toDataURL("image/jpeg", 0.98), "JPEG", m, currentY, iw, sliceH, undefined, 'FAST');
                  
                  remaining -= sliceH;
                  srcY += slicePixH;
                  currentY += sliceH;
                  if (remaining > 0) {
                    pdf.addPage();
                    currentY = m;
                  }
                }
              } else {
                pdf.addImage(canvas.toDataURL("image/jpeg", 0.98), "JPEG", m, currentY, iw, imgH, undefined, 'FAST');
                currentY += imgH;
              }
            }

            document.body.removeChild(hiddenDiv);

            const pdfArrayBuffer = pdf.output("arraybuffer");
            pdfB64 = uint8ToBase64(new Uint8Array(pdfArrayBuffer));
            pdfFilename = `Bilan_Maths_${prenom.replace(/[^a-z0-9]/gi,"_")}.pdf`;

          } catch(e) { console.error("Erreur PDF corrigé:", e); }
          
          try {
            await sendGmail(c.email, subject, body, pdfB64, pdfFilename);
          } catch(e) {
            errors.push(c.name);
          }
          idx++;
        }
        setProgress(100);
        setMailsDone(true); setBusy(false);
        setStatus(errors.length ? `⚠️ Échec d'envoi pour : ${errors.join(", ")}` : "✅ Mails envoyés !");
      };

      return (
        <div style={{ maxWidth:700, margin:"0 auto", padding:"1.5rem 1rem" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"1.5rem" }}>
            <div>
              <h1 style={{ fontSize:16, marginBottom:2 }}>📐 {sessionName}</h1>
              <span style={{ fontSize:12, color:"#9ca3af", cursor:"pointer" }} onClick={onBack}>← Tous les devoirs</span>
            </div>
            <div style={{ fontSize:11, color:"#9ca3af" }}>💾 Sauvegarde automatique</div>
          </div>

          <Card>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Field label="🔑 Clé API Google AI Studio">
                <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="AIzaSy..." style={{ fontFamily:"monospace" }}/>
              </Field>
              <Field label="🤖 Modèle d'IA pour la correction">
                <select value={modelChoice} onChange={e => setModelChoice(e.target.value)}>
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash (Recommandé)</option>
                  <option value="gemini-1.5-flash">Gemini 1.5 Flash (Rapide)</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro (Lent - Limité par Google)</option>
                </select>
              </Field>
            </div>
            {!apiKey&&<p style={{ fontSize:12,color:"#dc2626",marginTop:6 }}>⚠️ Saisissez votre clé API Gemini pour activer l'outil.</p>}
            {apiKey&&<p style={{ fontSize:12,color:"#16a34a",marginTop:6 }}>✓ Prêt avec {modelChoice}.</p>}
          </Card>

          <div style={{ display:"flex", alignItems:"flex-start", marginBottom:"2rem" }}>
            {STEPS.map((label,i)=>{
              const done=i<step,active=i===step;
              return (
                <div key={i} style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6 }}>
                  <div style={{ display:"flex",alignItems:"center",width:"100%" }}>
                    {i>0&&<div style={{ flex:1,height:"0.5px",marginTop:16,background:i<=step?"#16a34a":"#e5e7eb" }}/>}
                    <div onClick={()=>done&&setStep(i)} style={{
                      width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:13,fontWeight:500,flexShrink:0,cursor:done?"pointer":"default",
                      background:done?"#dcfce7":active?"#fff":"#f3f4f6",
                      color:done?"#16a34a":active?"#1d4ed8":"#9ca3af",
                      border:done?"none":active?"2px solid #1d4ed8":"0.5px solid #e5e7eb",
                    }}>{done?"✓":i+1}</div>
                    {i<3&&<div style={{ flex:1,height:"0.5px",marginTop:16,background:i<step?"#16a34a":"#e5e7eb" }}/>}
                  </div>
                  <span style={{ fontSize:11,textAlign:"center",color:active?"#1d4ed8":"#9ca3af",fontWeight:active?500:400 }}>{label}</span>
                </div>
              );
            })}
          </div>

          {(busy || status) && (
            <div style={{ background: status.includes("❌") || status.includes("⚠️") ? "#fee2e2" : "#fff", border: status.includes("❌") || status.includes("⚠️") ? "0.5px solid #fca5a5" : "0.5px solid #e5e7eb", borderRadius:10, padding:"14px 16px", marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: busy ? 8 : 0, fontSize:13 }}>
                <span style={{ fontWeight:500, color: status.includes("❌") || status.includes("⚠️") ? "#dc2626" : "#1d4ed8" }}>{status}</span>
                {busy && <span style={{ fontWeight:600, color:"#111827" }}>{progress}%</span>}
              </div>
              {busy && (
                <div style={{ width:"100%", background:"#f3f4f6", height:8, borderRadius:4, overflow:"hidden" }}>
                  <div style={{ width:`${progress}%`, background:"#1d4ed8", height:"100%", transition:"width 0.2s ease" }} />
                </div>
              )}
            </div>
          )}

          {step===0&&(<>
            <Card>
              <div style={{ fontSize:14,fontWeight:500,marginBottom:10 }}>📄 Votre sujet (PDF)</div>
              <p style={{ fontSize:13,color:"#6b7280",marginBottom:12 }}>Déposez ici le fichier PDF de votre sujet d'évaluation. L'IA l'utilisera comme référence pour la correction.</p>
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleSubjectPdf(e.dataTransfer.files[0]);}}
                onClick={()=>document.getElementById("subj-pdf").click()}
                style={{ border:"1.5px dashed #d1d5db",borderRadius:8,padding:"2.5rem",textAlign:"center",cursor:"pointer",background:upSubPdf?"#f0fdf4":"#f9fafb" }}>
                <input id="subj-pdf" type="file" accept="application/pdf" style={{ display:"none" }} onChange={e=>handleSubjectPdf(e.target.files[0])}/>
                {upSubPdf?<span style={{ color:"#16a34a",fontWeight:500,fontSize:14 }}>✓ {upSubPdfName}</span>:<span style={{ color:"#6b7280",fontSize:13 }}>Glissez le PDF du sujet ici ou cliquez pour parcourir</span>}
              </div>
            </Card>
          </>)}

          {step===1&&(<>
            {upSubPdfName&&(
              <Card>
                <div style={{ display:"flex",alignItems:"center",gap:10 }}>
                  <span style={{ fontSize:20, color:"#16a34a" }}>✓</span>
                  <div>
                    <div style={{ fontSize:14,fontWeight:500 }}>Sujet chargé : {upSubPdfName}</div>
                    <div style={{ fontSize:12,color:"#6b7280" }}>Ce document sera utilisé par l'IA à l'étape de correction.</div>
                  </div>
                </div>
              </Card>
            )}
            <Card>
              <div style={{ fontSize:14,fontWeight:500,marginBottom:10 }}>👥 Liste des élèves</div>
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();addCopiesPdf(e.dataTransfer.files);}}
                onClick={()=>document.getElementById("copies-pdf").click()}
                style={{ border:"1.5px dashed #d1d5db",borderRadius:8,padding:"1rem",textAlign:"center",cursor:"pointer",marginBottom:10,background:copiesPdfs.length?"#f0fdf4":"#f9fafb" }}>
                <input id="copies-pdf" type="file" accept="application/pdf" multiple style={{ display:"none" }} onChange={e=>{if(e.target.files.length)addCopiesPdf(e.target.files);}}/>
                {copiesPdfs.length>0
                  ?<span style={{ color:"#16a34a",fontWeight:500 }}>✓ {copiesPdfs.length} fichier{copiesPdfs.length>1?"s":""} — {copiesPdfName}</span>
                  :<span style={{ color:"#6b7280",fontSize:13 }}>📄 Déposez le(s) PDF des copies pour extraire les noms<br/><span style={{ fontSize:11 }}>(réutilisé à l'étape Correction)</span></span>}
              </div>
              {extracting&&<p style={{ fontSize:12,color:"#1d4ed8",marginBottom:8,textAlign:"center" }}>🔍 Extraction des noms en cours…</p>}
              <Field label={copiesPdfs.length>0?"Noms extraits — vérifiez et complétez les emails (Nom, email)":"Ou saisissez manuellement — Nom Prénom, email"}>
                <textarea value={studentsRaw} onChange={e=>setStudentsRaw(e.target.value)}
                  placeholder={"Marie Dupont, marie.dupont@lycee.fr\nPaul Martin, paul.martin@lycee.fr"}
                  style={{ minHeight:100,fontFamily:"monospace",fontSize:12 }}/>
              </Field>
            </Card>
          </>)}

          {step===2&&(<>
            {corrections.length===0&&(
              <Card>
                <div style={{ fontSize:14,fontWeight:500,marginBottom:10 }}>📄 Copies à corriger</div>
                
                <div style={{ background:"#f0fdf4",border:"0.5px solid #86efac",borderRadius:8,padding:"10px 12px",margin:"12px 0",fontSize:13,color:"#166534" }}>
                  💡 <strong>Processus simplifié :</strong> Déposez votre PDF contenant les copies des élèves. L'IA va analyser le document, trouver la copie correspondante pour chaque élève de votre liste, et la corriger automatiquement.
                </div>

                <div onDragOver={e=>e.preventDefault()}
                  onDrop={e=>{e.preventDefault();addCopiesPdf(e.dataTransfer.files);}}
                  onClick={()=>document.getElementById("copies-pdf2").click()}
                  style={{ border:"1.5px dashed #d1d5db",borderRadius:8,padding:"1.5rem",textAlign:"center",cursor:"pointer",marginBottom:10,background:copiesPdfs.length?"#f0fdf4":"#f9fafb" }}>
                  <input id="copies-pdf2" type="file" accept="application/pdf" multiple style={{ display:"none" }}
                    onChange={e=>addCopiesPdf(e.target.files)}/>
                  {copiesPdfs.length===0
                    ? <span style={{ color:"#6b7280",fontSize:13 }}>Glissez votre fichier PDF ici ou cliquez</span>
                    : <span style={{ color:"#16a34a",fontSize:13, fontWeight:500 }}>✓ {copiesPdfs.length} lot(s) de copies chargé(s)</span>
                  }
                </div>

                {copiesPdfs.length>0&&(
                  <div style={{ marginBottom:14 }}>
                    {copiesPdfs.map((p,i)=>(
                      <div key={i} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,padding:"4px 8px",background:"#f3f4f6",borderRadius:6,marginBottom:4 }}>
                        <span>📄 {p.name}</span>
                        <span style={{ color:"#dc2626",cursor:"pointer",padding:"0 4px",fontWeight:600 }}
                          onClick={()=>setCopiesPdfs(prev=>prev.filter((_,j)=>j!==i))}>✕</span>
                      </div>
                    ))}
                  </div>
                )}

                {copiesPdfs.length > 0 && (
                  <button disabled={busy||!apiKey||students.length===0} onClick={executeCorrection} style={{ width:"100%", background: "#16a34a", border: "none", padding: "12px", fontSize: 14, fontWeight: 500 }}>
                    {busy ? "Correction en cours..." : `🤖 Lancer la correction globale (${students.length} élèves)`}
                  </button>
                )}
              </Card>
            )}
            
            {corrections.length>0&&(<>
              <div style={{ background:"#e0f2fe", border:"0.5px solid #bae6fd", borderRadius:10, padding:"12px 14px", marginBottom:16, fontSize:13, color:"#0369a1" }}>
                📝 <strong>Écran de relecture :</strong> Vous pouvez vérifier et ajuster les notes, appréciations ou conseils générés par l'IA ci-dessous. Les modifications seront prises en compte dans le mail final.
              </div>
              
              {students.map(s=>{
                const c=corrections.find(x=>x.id===s.id);
                return (
                  <Card key={s.id}>
                    <SectionHead title={s.name} right={c&&!c.skipped
                      ?<div style={{ display:"flex",alignItems:"center",gap:8 }}>
                          {c.reviewNeeded && <Bdg color="danger">⚠️ À relire</Bdg>}
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <input 
                              type="text" 
                              value={c.note ?? ""} 
                              onChange={e => updateCorrection(s.id, 'note', e.target.value)} 
                              style={{ width: 55, textAlign: "center", fontSize: 14, fontWeight: "600", padding: "3px 6px", border: "1px solid #d1d5db", borderRadius: 6 }}
                            />
                            <span style={{ fontSize:13, color:"#6b7280" }}>/20</span>
                          </div>
                        </div>:null}/>
                    {c&&!c.skipped?(<div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 4 }}>
                      
                      <Field label="Appréciation générale (modifiable - encadrez vos formules par $...$)">
                        <textarea 
                          value={c.appreciation || ""} 
                          onChange={e => updateCorrection(s.id, 'appreciation', e.target.value)} 
                          style={{ minHeight: 60, fontSize: 13, lineHeight: 1.4, marginBottom: 4 }}
                        />
                        <div style={{ fontSize: 13, padding: "8px", background: "#f9fafb", borderRadius: "6px", border: "1px dashed #d1d5db" }}
                             dangerouslySetInnerHTML={{ __html: latexToHtml(c.appreciation || "Aperçu du rendu...") }} />
                      </Field>
                      
                      {c.details?.map((d,i)=>(
                        <div key={i} style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",fontSize:12,padding:"4px 0",borderTop:"0.5px solid #e5e7eb" }}>
                          <span style={{ color:"#6b7280", marginRight: 8, flexShrink: 0 }}>{d.exercice}</span>
                          <span style={{ fontWeight:500, textAlign:"right" }} dangerouslySetInnerHTML={{ __html: `<strong>${d.obtenu}/${d.sur}</strong> — ` + (d.remarque ? latexToHtml(d.remarque).replace(/^<p[^>]*>/, '').replace(/<\/p>$/, '') : "") }} />
                        </div>
                      ))}
                      
                      <Field label="Conseil d'amélioration (modifiable - encadrez vos formules par $...$)">
                        <textarea 
                          value={c.conseil || ""} 
                          onChange={e => updateCorrection(s.id, 'conseil', e.target.value)} 
                          style={{ minHeight: 40, fontSize: 12, fontStyle: "italic", lineHeight: 1.4, color: "#1e3a8a", marginBottom: 4 }}
                        />
                        <div style={{ fontSize: 13, padding: "8px", background: "#f9fafb", borderRadius: "6px", border: "1px dashed #d1d5db" }}
                             dangerouslySetInnerHTML={{ __html: latexToHtml(c.conseil || "Aperçu du rendu...") }} />
                      </Field>

                    </div>):<p style={{ fontSize:13,color:"#9ca3af",fontStyle:"italic" }}>Copie non trouvée ou non traitée par l'IA.</p>}
                  </Card>
                );
              })}

              {(() => {
                const firstWithCorrection = corrections.find(x => !x.skipped && x.latexCorrection);
                if (firstWithCorrection) {
                  return (
                    <Card>
                      <SectionHead title="Corrigé mathématique général du devoir (généré par l'IA)" />
                      <div
                        style={{
                          background:"#fff",
                          border:"1px solid #e5e7eb",
                          borderRadius:8,
                          padding:"16px",
                          maxHeight:"400px",
                          overflow:"auto",
                          fontSize: 13,
                          lineHeight: 1.6
                        }}
                        dangerouslySetInnerHTML={{
                          __html: latexToHtml(firstWithCorrection.latexCorrection)
                        }}
                      />
                    </Card>
                  );
                }
                return null;
              })()}

              <div style={{ display:"flex",gap:8,marginTop:4 }}>
                <button onClick={()=>{setCorrections([]);}} style={{ flex:1,background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db" }}>↩ Recommencer</button>
                <button disabled={busy||!apiKey} onClick={()=>document.getElementById("late-pdf").click()}
                  style={{ flex:1,background:"#f3f4f6",color:"#1d4ed8",border:"0.5px solid #bfdbfe",fontSize:12 }}>
                  ➕ Copie en retard
                </button>
                <input id="late-pdf" type="file" accept="application/pdf" style={{ display:"none" }} onChange={async e=>{
                  const f=e.target.files[0]; if(!f)return;
                  setBusy(true); setStatus(`Correction de la copie en retard : ${f.name}…`); setProgress(30);
                  readPdf(f, async b64 => {
                    setCopiesPdfs(prev=>[...prev,{name:f.name,b64}]);
                    try {
                      const parts = [];
                      if (upSubPdf) {
                        parts.push({ inlineData: { mimeType: "application/pdf", data: upSubPdf } });
                      }
                      parts.push({ inlineData: { mimeType: "application/pdf", data: b64 } });
                      
                      const sysInstructionLate = `Tu es un correcteur de mathématiques. Adopte la posture d'un coach bienveillant : tutoie toujours l'élève et utilise son prénom seul.`;
                      
                      parts.push({ text: `Corrige cette copie en retard (PDF joint).
FORMAT STRICT JSON :
[{"name":"Nom Prénom","analyse_decryptage_brouillon":"...","note":14.25,"reviewNeeded":false,"appreciation":"...","details":[{"exercice":"Exercice 1","sur":2.0,"obtenu":1.0,"remarque":"..."}],"conseil":"...","latexCorrection":"\\\\section*{Corrigé}\\\\n..."}]` });
                      
                      const raw = await callGemini(apiKey, parts, sysInstructionLate, true, modelChoice, (msg) => { setStatus(`[Retard] ${msg}`); });
                      const arr = safeJSONParse(raw);
                      if(arr.length>0){
                        const newC=arr[0];
                        const existingStudent=students.find(s=>s.name.toLowerCase().includes(newC.name?.split(" ")[0]?.toLowerCase()));
                        setCorrections(prev=>[...prev,{...(existingStudent||{id:Date.now(),name:newC.name,email:""}),...newC}]);
                      }
                      setProgress(100); setBusy(false); setStatus("✅ Copie ajoutée");
                    } catch(err){
                      setStatus("❌ Erreur copie en retard : " + err.message); setBusy(false);
                    }
                  });
                }}/>
              </div>
            </>)}
          </>)}

          {step===3&&(
            <Card>
              <div style={{ display:"flex",gap:8,marginBottom:16 }}>
                <button onClick={exportCsv} style={{ flex:1,fontSize:12,background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db" }}>📊 CSV</button>
                <button onClick={exportPdfRecap} disabled={!libsOk.jspdf} style={{ flex:1,fontSize:12,background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db" }}>📄 PDF récap</button>
              </div>
              <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:12,marginBottom:16 }}>
                {validCorrs.map(c=>{
                  const nc=!isNaN(+c.note)?(+c.note>=10?"#16a34a":"#dc2626"):"#6b7280";
                  return (
                    <div key={c.id} style={{ background:"#f3f4f6",borderRadius:8,padding:14,textAlign:"center" }}>
                      <div style={{ fontSize:11,color:"#6b7280",marginBottom:4 }}>{c.name}</div>
                      <div style={{ fontSize:26,fontWeight:500,color:nc }}>{c.note}<span style={{ fontSize:14,color:"#6b7280" }}>/20</span></div>
                    </div>
                  );
                })}
              </div>
              <div style={{ display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:"0.5px solid #e5e7eb" }}>
                <span style={{ fontSize:13,color:"#6b7280" }}>Moyenne de classe</span>
                <span style={{ fontSize:18,fontWeight:500 }}>{validCorrs.length>0?avg.toFixed(1):"—"}/20</span>
              </div>

              <div style={{ background:"#f0fdf4",border:"0.5px solid #86efac",borderRadius:8,padding:"10px 12px",margin:"12px 0",fontSize:12,color:"#166534" }}>
                ✉️ Les mails seront envoyés automatiquement depuis <strong>maths.perriand@gmail.com</strong>.<br/>
                Un écran Google s'ouvrira la première fois pour confirmer l'autorisation.
              </div>
              {mailsDone
                ?<div style={{ textAlign:"center",padding:"1.5rem" }}>
                    <div style={{ fontSize:28,marginBottom:8 }}>✅</div>
                    <span style={{ fontWeight:500,color:"#16a34a" }}>Mails envoyés à tous les élèves !</span>
                  </div>
                : <button disabled={busy} onClick={sendResults} style={{ width:"100%",marginTop:8 }}>
                    {busy ? "Préparation des envois…" : "📬 Préparer et envoyer les résultats"}
                  </button>
              }
            </Card>
          )}

          <div style={{ display:"flex",justifyContent:"space-between",marginTop:"1.5rem" }}>
            {step>0?<button style={{ background:"#f3f4f6",color:"#374151",border:"0.5px solid #d1d5db" }} disabled={busy} onClick={()=>setStep(step-1)}>← Retour</button>:<div/>}
            {step<3&&<button disabled={!canNext||busy||!apiKey} onClick={()=>setStep(step+1)}>
              {["Diffuser →","Corriger les copies →","Voir les résultats →"][step]}
            </button>}
          </div>
          <p style={{ textAlign:"center",fontSize:11,color:"#9ca3af",marginTop:"2rem" }}>Propulsé par Google Gemini</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
