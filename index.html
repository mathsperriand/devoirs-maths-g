<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Diagnostic API Gemini</title>
</head>
<body>
  <h1>Diagnostic de la connexion API</h1>
  <input type="password" id="apiKeyInput" placeholder="Colle ta clé API ici">
  <button onclick="diagnose()">Diagnostiquer</button>
  <pre id="log" style="background:#eee; padding:10px;"></pre>

  <script>
    async function diagnose() {
      const apiKey = document.getElementById('apiKeyInput').value;
      const log = document.getElementById('log');
      log.textContent = "Test en cours...";

      try {
        // 1. Appel pour lister les modèles disponibles (version v1)
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`);
        const data = await response.json();

        if (data.models) {
          log.textContent = "Modèles trouvés :\n" + data.models.map(m => m.name).join('\n');
          alert("L'API fonctionne ! Copie le nom d'un modèle ci-dessus pour ton code.");
        } else {
          log.textContent = "Erreur API : " + JSON.stringify(data, null, 2);
        }
      } catch (e) {
        log.textContent = "Erreur réseau : " + e.message;
      }
    }
  </script>
</body>
</html>
